<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>錐形件計算工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px;
    max-width: 880px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 small {
    font-size: 14px;
    font-weight: 400;
    color: #666;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 28px;
    border-left: 3px solid #4a90d9;
    padding-left: 12px;
  }
  .layout {
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
  }
  .form-section {
    flex: 1;
    min-width: 280px;
  }
  .canvas-section {
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .input-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 4px;
  }
  .field .hint {
    font-size: 11px;
    color: #999;
    font-weight: 400;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    transition: border-color 0.2s;
    background: #fafafa;
    outline: none;
  }
  .field input:focus {
    border-color: #4a90d9;
    background: #fff;
  }
  .field input.input-auto {
    border-color: #4a90d9;
    background: #eef6ff;
  }
  .field input.disabled {
    background: #f0f0f0;
    color: #999;
    cursor: not-allowed;
  }
  .field .unit {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }
  .known-badge {
    display: inline-block;
    font-size: 10px;
    background: #4a90d9;
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .auto-badge {
    display: inline-block;
    font-size: 10px;
    background: #f5a623;
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #4a90d9;
    color: #fff;
  }
  .btn-primary:hover { background: #357abd; transform: translateY(-1px); }
  .btn-secondary {
    background: #e8e8e8;
    color: #555;
  }
  .btn-secondary:hover { background: #d5d5d5; }
  .btn-success {
    background: #27ae60;
    color: #fff;
  }
  .btn-success:hover { background: #219a52; transform: translateY(-1px); }
  .result-box {
    margin-top: 20px;
    padding: 18px 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 14px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .result-box .label {
    font-size: 12px;
    opacity: 0.8;
  }
  .result-box .value {
    font-size: 22px;
    font-weight: 700;
  }
  .result-box .value small {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.7;
    margin-left: 4px;
  }
  .result-item {
    text-align: center;
  }
  canvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    max-width: 100%;
    height: auto;
  }
  .canvas-label {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
  }
  .error-msg {
    background: #fff0f0;
    color: #d63031;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 12px;
    border: 1px solid #ffcccc;
    display: none;
  }
  .error-msg.show { display: block; }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 12px;
    color: #666;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  @media (max-width: 700px) {
    .container { padding: 20px; }
    .input-group { grid-template-columns: 1fr; }
    .result-box { flex-direction: column; align-items: stretch; }
    .result-item { display: flex; justify-content: space-between; align-items: center; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔩 錐形件計算機 <small>Cone Calculator</small></h1>
  <div class="subtitle">填寫任意三項已知尺寸，自動計算未知項與重量（一般碳鋼 ρ = 7.85 g/cm³）</div>

  <div class="layout">
    <div class="form-section">
      <div class="input-group" id="fieldsContainer">
        <div class="field" data-key="D">
          <label>大端直徑 <span class="known-badge" id="badge-D">已知</span></label>
          <input type="number" id="input-D" step="any" min="0" placeholder="mm">
          <div class="unit">mm</div>
        </div>
        <div class="field" data-key="d">
          <label>小端直徑 <span class="known-badge" id="badge-d">已知</span></label>
          <input type="number" id="input-d" step="any" min="0" placeholder="mm">
          <div class="unit">mm</div>
        </div>
        <div class="field" data-key="A">
          <label>半角（半錐角） <span class="known-badge" id="badge-A">已知</span></label>
          <input type="number" id="input-A" step="any" min="0" max="89" placeholder="°">
          <div class="unit">度 (°)</div>
        </div>
        <div class="field" data-key="L">
          <label>錐長 <span class="known-badge" id="badge-L">已知</span></label>
          <input type="number" id="input-L" step="any" min="0" placeholder="mm">
          <div class="unit">mm</div>
        </div>
      </div>

      <div style="margin-top: 4px; font-size: 12px; color: #999;">
        💡 灰色輸入框 = 待求項（自動計算）
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnCalc">🧮 計算</button>
        <button class="btn btn-secondary" id="btnClear">↺ 清空</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="result-box" id="resultBox">
        <div class="result-item">
          <div class="label">待求項</div>
          <div class="value" id="resultUnknown">—</div>
        </div>
        <div class="result-item">
          <div class="label">總重量（一般碳鋼）</div>
          <div class="value" id="resultWeight"><span id="weightValue">0.000</span> <small>kg</small></div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#4a90d9"></span> 已知</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f5a623"></span> 自動計算</div>
      </div>
    </div>

    <div class="canvas-section">
      <canvas id="previewCanvas" width="380" height="360"></canvas>
      <div class="canvas-label">📐 錐形件截面示意圖</div>
    </div>
  </div>
</div>

<script>
(function() {
  // ---- DOM refs ----
  const inputD = document.getElementById('input-D');
  const inputd = document.getElementById('input-d');
  const inputA = document.getElementById('input-A');
  const inputL = document.getElementById('input-L');
  const badgeD = document.getElementById('badge-D');
  const badged = document.getElementById('badge-d');
  const badgeA = document.getElementById('badge-A');
  const badgeL = document.getElementById('badge-L');
  const errorMsg = document.getElementById('errorMsg');
  const resultUnknown = document.getElementById('resultUnknown');
  const weightValue = document.getElementById('weightValue');
  const btnCalc = document.getElementById('btnCalc');
  const btnClear = document.getElementById('btnClear');
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');

  const fieldKeys = ['D','d','A','L'];
  const inputs  = { D: inputD, d: inputd, A: inputA, L: inputL };
  const badges  = { D: badgeD, d: badged, A: badgeA, L: badgeL };

  // ---- which field is auto (the one with fewest filled) ----
  let autoField = null;

  function detectAuto() {
    autoField = null;
    let minVal = Infinity;
    for (const k of fieldKeys) {
      const v = parseFloat(inputs[k].value);
      if (!isNaN(v) && v > 0) continue;
      // empty or invalid
      const count = countFilled();
      if (count === 4) { autoField = null; break; }
      // pick the last empty one
      autoField = k;
      break;
    }
    // If exactly 3 filled, auto should be the only empty one
    const filled = fieldKeys.filter(k => {
      const v = parseFloat(inputs[k].value);
      return !isNaN(v) && v > 0;
    });
    const empty = fieldKeys.filter(k => !filled.includes(k));
    if (filled.length === 3 && empty.length === 1) {
      autoField = empty[0];
    } else if (filled.length < 3) {
      autoField = null;
    }
    updateBadges();
  }

  function countFilled() {
    return fieldKeys.filter(k => {
      const v = parseFloat(inputs[k].value);
      return !isNaN(v) && v > 0;
    }).length;
  }

  function updateBadges() {
    for (const k of fieldKeys) {
      const v = parseFloat(inputs[k].value);
      const filled = !isNaN(v) && v > 0;
      const isAuto = (k === autoField);
      inputs[k].classList.toggle('input-auto', isAuto);
      inputs[k].disabled = isAuto;
      if (isAuto) {
        badges[k].textContent = '自動';
        badges[k].className = 'auto-badge';
      } else if (filled) {
        badges[k].textContent = '已知';
        badges[k].className = 'known-badge';
      } else {
        badges[k].textContent = '待填';
        badges[k].className = 'known-badge';
        badges[k].style.background = '#bbb';
      }
    }
  }

  // ---- listeners ----
  for (const k of fieldKeys) {
    inputs[k].addEventListener('input', detectAuto);
  }
  detectAuto(); // initial

  function clearAll() {
    for (const k of fieldKeys) { inputs[k].value = ''; }
    resultUnknown.textContent = '—';
    weightValue.textContent = '0.000';
    errorMsg.classList.remove('show');
    errorMsg.textContent = '';
    autoField = null;
    detectAuto();
    drawPreview(null, null, null, null, null);
  }
  btnClear.addEventListener('click', clearAll);

  // ---- Core calc ----
  function compute() {
    const vals = {};
    for (const k of fieldKeys) {
      vals[k] = parseFloat(inputs[k].value);
    }
    const filled = fieldKeys.filter(k => !isNaN(vals[k]) && vals[k] > 0);

    if (filled.length < 3) {
      showError('請至少填入三項已知尺寸（正值）');
      return null;
    }

    // D = d + 2*L*tan(A)
    // d = D - 2*L*tan(A)
    // A = atan((D-d)/(2*L))
    // L = (D-d)/(2*tan(A))

    const D = vals.D, d = vals.d, A = vals.A, L = vals.L;
    const deg2rad = deg => deg * Math.PI / 180;
    const rad2deg = r => r * 180 / Math.PI;

    let result = { ...vals };
    let computedKey = null;

    // Try to find missing one
    if (filled.length === 3) {
      const missing = fieldKeys.find(k => !filled.includes(k));
      computedKey = missing;
      try {
        switch (missing) {
          case 'D':
            if (d && L && A !== undefined && !isNaN(A)) {
              result.D = d + 2 * L * Math.tan(deg2rad(A));
            } else if (d && L && A === undefined && vals.A === undefined) {
              // shouldn't happen since we have 3 filled
            }
            break;
          case 'd':
            if (D && L && A !== undefined && !isNaN(A)) {
              result.d = D - 2 * L * Math.tan(deg2rad(A));
            }
            break;
          case 'A':
            if (D && d && L) {
              const tanA = (D - d) / (2 * L);
              if (tanA <= 0) { showError('D 必須大於 d，且為正數'); return null; }
              result.A = rad2deg(Math.atan(tanA));
            }
            break;
          case 'L':
            if (D && d && A !== undefined && !isNaN(A)) {
              const tanA = Math.tan(deg2rad(A));
              if (tanA <= 0) { showError('角度必須大於 0°'); return null; }
              result.L = (D - d) / (2 * tanA);
            }
            break;
        }
      } catch(e) {
        showError('計算錯誤：' + e.message);
        return null;
      }
    } else {
      // all 4 filled, still can compute
      computedKey = null;
      result = { D, d, A, L };
    }

    // Validate
    if (result.D !== undefined && result.d !== undefined && result.D <= result.d) {
      showError('大端直徑 (D) 必須大於小端直徑 (d)');
      return null;
    }
    if (result.A !== undefined && (result.A <= 0 || result.A >= 90)) {
      showError('半角必須在 0°~90° 之間');
      return null;
    }
    if (result.L !== undefined && result.L <= 0) {
      showError('錐長必須為正數');
      return null;
    }

    // ---- Weight calculation ----
    // D,d,L in mm -> convert to cm
    const D_cm = result.D / 10;
    const d_cm = result.d / 10;
    const L_cm = result.L / 10;
    // Volume of truncated cone: V = (1/3)*pi*h*(R^2 + R*r + r^2)
    const V_cm3 = (1/3) * Math.PI * L_cm * ((D_cm/2)**2 + (D_cm/2)*(d_cm/2) + (d_cm/2)**2);
    // Carbon steel density 7.85 g/cm^3 -> kg
    const weight_kg = V_cm3 * 7.85 / 1000;
    result.weight = weight_kg;

    errorMsg.classList.remove('show');
    return { result, computedKey };
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }

  // ---- button calc ----
  btnCalc.addEventListener('click', function() {
    const out = compute();
    if (!out) return;
    const { result, computedKey } = out;

    // Update auto field display
    if (computedKey) {
      const val = result[computedKey];
      inputs[computedKey].value = val.toFixed(3);
      // Show result text
      const labels = { D:'大端直徑 (D)', d:'小端直徑 (d)', A:'半角 (A)', L:'錐長 (L)' };
      const units = { D:'mm', d:'mm', A:'°', L:'mm' };
      resultUnknown.innerHTML = `${labels[computedKey]} = <strong>${val.toFixed(3)}</strong> ${units[computedKey]}`;
    } else {
      // All known - just confirm
      resultUnknown.innerHTML = '所有尺寸已知 ✅';
    }

    weightValue.textContent = result.weight.toFixed(3);

    // Draw preview
    drawPreview(result.D, result.d, result.L, result.A, result.weight);
    detectAuto();
  });

  // ---- Canvas draw ----
  function drawPreview(D, d, L, A, weight) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    if (!D || !d || !L) {
      // Draw placeholder
      ctx.fillStyle = '#f0f2f5';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#bbb';
      ctx.font = '15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('填寫尺寸後查看預覽', W/2, H/2);
      return;
    }

    const maxDim = Math.max(D, d, L);
    const scale = (Math.min(W, H) * 0.7) / maxDim;
    const ctrX = W / 2;
    const baseY_top = 60;
    const baseY_bot = H - 40;

    // Scaled dimensions
    const sD = D * scale;
    const sd = d * scale;
    const sL = (H - baseY_top - 40) + 30; // Fill height roughly

    // Actually compute proper scaling
    const availH = H - baseY_top - 50;
    const sL2 = L * scale;
    const finalScale = Math.min(scale, availH / L);
    const rD = D * finalScale;
    const rd = d * finalScale;
    const rL = L * finalScale;

    const halfD = rD / 2;
    const halfd = rd / 2;

    // Draw from bottom up
    const bottomY = H - 40;
    const topY = bottomY - rL;

    // ---- Draw cone shape ----
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = 'rgba(74, 144, 217, 0.15)';

    ctx.beginPath();
    ctx.moveTo(ctrX - halfD, bottomY);
    ctx.lineTo(ctrX + halfD, bottomY);
    ctx.lineTo(ctrX + halfd, topY);
    ctx.lineTo(ctrX - halfd, topY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // ---- Dashed centerline ----
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ctrX, topY);
    ctx.lineTo(ctrX, bottomY + 10);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- Dimension lines ----
    function drawDimLine(y, label, leftX, rightX, offsetX) {
      const off = offsetX || 60;
      const x1 = leftX - off;
      const x2 = rightX + off;
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      // arrow left
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x1 + 8, y - 4);
      ctx.moveTo(x1, y);
      ctx.lineTo(x1 + 8, y + 4);
      ctx.stroke();
      // arrow right
      ctx.beginPath();
      ctx.moveTo(x2, y);
      ctx.lineTo(x2 - 8, y - 4);
      ctx.moveTo(x2, y);
      ctx.lineTo(x2 - 8, y + 4);
      ctx.stroke();
      // label
      ctx.fillStyle = '#e74c3c';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, (x1+x2)/2, y - 6);
    }

    // D at bottom
    drawDimLine(bottomY + 28, `D = ${D.toFixed(1)}`, ctrX - halfD, ctrX + halfD, 0);
    // d at top
    drawDimLine(topY - 20, `d = ${d.toFixed(1)}`, ctrX - halfd, ctrX + halfd, 0);

    // L on the side (right side)
    const rightX = Math.max(ctrX + halfD, ctrX + halfd) + 50;
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(rightX, bottomY);
    ctx.lineTo(rightX, topY);
    ctx.stroke();
    // arrows
    ctx.beginPath();
    ctx.moveTo(rightX, bottomY);
    ctx.lineTo(rightX - 5, bottomY - 8);
    ctx.moveTo(rightX, bottomY);
    ctx.lineTo(rightX + 5, bottomY - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightX, topY);
    ctx.lineTo(rightX - 5, topY + 8);
    ctx.moveTo(rightX, topY);
    ctx.lineTo(rightX + 5, topY + 8);
    ctx.stroke();
    ctx.fillStyle = '#27ae60';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`L = ${L.toFixed(1)}`, rightX + 8, (topY+bottomY)/2 + 5);

    // Angle arc at bottom-left
    if (A !== undefined && A !== null) {
      const ang = A * Math.PI / 180;
      const arcR = 25;
      ctx.strokeStyle = '#8e44ad';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      // arc from left edge upward
      ctx.arc(ctrX - halfD, bottomY, arcR, Math.PI * 1.5, Math.PI * 1.5 + ang, false);
      ctx.stroke();
      // label
      ctx.fillStyle = '#8e44ad';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`α = ${A.toFixed(1)}°`, ctrX - halfD - 20, bottomY - arcR - 6);
    }

    // Weight label
    if (weight !== undefined && weight !== null) {
      ctx.fillStyle = '#555';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`重量: ${weight.toFixed(3)} kg`, ctrX, topY - 45);
    }
  }

  // Draw initial
  drawPreview(null, null, null, null, null);

  // ---- Keyboard support ----
  for (const k of fieldKeys) {
    inputs[k].addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btnCalc.click();
    });
  }

  // ---- Clear initial state ----
  clearAll();

})();
</script>
</body>
</html>
