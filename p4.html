<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P4 入料｜การป้อนวัตถุดิบ 自動解說課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+Thai+Looped:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEE; --surface:#FFFFFF; --ink:#1B232A; --muted:#5E6B75; --line:#C9D0D5;
  --steel:#2C3A45; --plate:#F2C230; --plate-ink:#1B1B14; --alert:#C2362B; --ok:#2F7D4F;
  --cap:#1F2A33; --cap-ink:#F4F6F7;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --th:"Noto Sans Thai Looped","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171C; --surface:#1B242B; --ink:#E7ECEF; --muted:#9AA7B0; --line:#33414B;
    --steel:#0D1317; --cap:#0D1317; --cap-ink:#F4F6F7; --alert:#F0675B; --ok:#5BC08A;
  }
}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1B242B; --ink:#E7ECEF; --muted:#9AA7B0; --line:#33414B;
  --steel:#0D1317; --cap:#0D1317; --cap-ink:#F4F6F7; --alert:#F0675B; --ok:#5BC08A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);overflow:hidden}
.th{font-family:var(--th)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column}
#viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;flex:none;position:relative;background:var(--surface);
  border-radius:6px;overflow:hidden;transform-origin:center center;box-shadow:0 2px 0 var(--line)}
#slide{position:absolute;inset:0 0 92px 0;padding:30px 56px 20px;display:flex;flex-direction:column}

/* caption strip = what is being said right now */
#cap{position:absolute;left:0;right:0;bottom:0;height:92px;background:var(--cap);color:var(--cap-ink);
  display:flex;align-items:center;gap:18px;padding:0 32px}
#cap .chip{flex:none;min-width:58px;text-align:center;padding:6px 10px;border-radius:4px;
  background:var(--plate);color:var(--plate-ink);font-weight:800;font-size:20px}
#cap .chip.zh{background:#DCE3E8;color:#1B232A}
#cap .txt{font-size:24px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cap .txt.th{font-size:25px}
#count{position:absolute;right:32px;top:-64px;width:56px;height:56px;border-radius:50%;
  background:var(--alert);color:#fff;font-size:28px;font-weight:900;display:none;align-items:center;justify-content:center}

/* signature: warehouse location plate */
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-weight:900;
  font-family:"Noto Sans TC",sans-serif;padding:4px 12px 3px;border-radius:3px;
  border:2px solid var(--plate-ink);letter-spacing:.02em;font-size:22px;line-height:1.2}
.plate.big{font-size:30px;padding:6px 16px 5px}

h1.t{margin:0;font-size:38px;font-weight:900;line-height:1.25;letter-spacing:.01em}
.t-th{margin:6px 0 0;font-family:var(--th);font-size:28px;font-weight:700;color:var(--muted);line-height:1.4}
.head{display:flex;align-items:flex-start;gap:18px;margin-bottom:16px}
.head .plate{margin-top:6px}

/* word card layout */
.card{flex:1;min-height:0;display:grid;grid-template-columns:430px 1fr;gap:40px}
.photo{border-radius:4px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.contain img{object-fit:contain}
.word{display:flex;flex-direction:column;min-height:0}
.w-th{font-family:var(--th);font-size:46px;font-weight:800;line-height:1.25;cursor:pointer}
.w-zh{font-size:30px;font-weight:700;margin-top:0;cursor:pointer}
.reads{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 12px;font-size:18px;color:var(--muted)}
.reads b{font-weight:500;color:var(--ink)}
.reads .th{font-size:21px}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:10px}
.pts li{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;font-size:20px;line-height:1.35;padding:4px 8px;border-radius:4px;transition:background .2s}
.pts li::before{content:"";width:12px;height:12px;margin-top:9px;border-radius:2px;background:var(--steel)}
.pts li.chk::before{background:var(--ok);border-radius:50%}
.pts li .th{grid-column:2;font-size:18px;color:var(--muted)}
.pts li .rd{grid-column:2;font-family:var(--th);font-size:16px;color:var(--muted);opacity:.85}
.pts li.on,.row.on,.st.on{background:color-mix(in srgb,var(--plate) 32%,transparent)}
[data-say]{cursor:pointer}

/* cover */
.cover{flex:1;display:grid;grid-template-columns:1fr 420px;gap:48px;align-items:center}
.cover .unit{font-size:28px;font-weight:700;color:var(--muted)}
.cover .big-zh{font-size:120px;font-weight:900;line-height:1.05;margin:10px 0 0}
.cover .big-th{font-family:var(--th);font-size:64px;font-weight:800;line-height:1.3}
.cover .how{margin-top:28px;font-size:20px;color:var(--muted);line-height:1.6}

/* two goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:8px}
.goal{border:3px solid var(--steel);border-radius:6px;padding:26px 30px}
.goal .n{font-size:22px;font-weight:900;color:var(--muted)}
.goal .g-zh{font-size:54px;font-weight:900;margin-top:4px}
.goal .g-th{font-family:var(--th);font-size:34px;font-weight:700;margin-top:4px;line-height:1.35}
.warn{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:center;
  background:color-mix(in srgb,var(--alert) 12%,transparent);border-left:8px solid var(--alert);padding:20px 28px;border-radius:4px}
.warn .num{grid-row:span 2;font-size:64px;font-weight:900;color:var(--alert);line-height:1}
.warn .num small{font-size:28px}
.warn .z{font-size:24px;font-weight:700}
.warn .th{font-size:22px;color:var(--muted)}

/* tag table */
.tagwrap{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:36px}
.tbl{display:flex;flex-direction:column;border-top:3px solid var(--steel)}
.row{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;padding:1px 10px;border-bottom:1px solid var(--line);border-radius:3px}
.row .z{font-size:20px;font-weight:700;line-height:1.2}
.row .z small{display:block;font-family:var(--th);font-size:13px;font-weight:400;color:var(--muted)}
.row .t{font-family:var(--th);font-size:19px;font-weight:700;line-height:1.2}
.row .t small{display:block;font-family:var(--zh);font-size:13px;font-weight:400;color:var(--muted)}
.row .ex{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.hdr{font-size:16px;color:var(--muted);border-bottom:2px solid var(--line)}

/* location */
.loc{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch}
.loc .steps{display:flex;flex-direction:column;gap:22px;justify-content:center}
.loc .stp{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;padding:8px;border-radius:4px}
.loc .stp .plate{grid-row:span 2}
.loc .stp .z{font-size:28px;font-weight:700}
.loc .stp .th{font-size:24px;color:var(--muted)}

/* path of wire */
.path{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative}
.node{display:flex;flex-direction:column;gap:10px;min-height:0;padding:8px;border-radius:5px;position:relative}
.node .photo{flex:1}
.node .plate{align-self:flex-start}
.node .nz{font-size:28px;font-weight:900}
.node .nt{font-family:var(--th);font-size:22px;font-weight:700;line-height:1.3;color:var(--muted)}
.node:not(:last-child)::after{content:"";position:absolute;right:-20px;top:42%;border:9px solid transparent;border-left:14px solid var(--steel)}
.node.on{background:color-mix(in srgb,var(--plate) 32%,transparent)}

/* numbers slide */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.nbox{border:3px solid var(--steel);border-radius:6px;padding:16px 22px}
.nbox .v{font-size:56px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.nbox .l{font-size:21px;font-weight:700;margin-top:4px}
.nbox .th{font-size:19px;color:var(--muted)}
.formula{margin-top:16px;font-size:17px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}

/* compare */
.cmp{flex:1;display:grid;grid-template-columns:170px 1fr 1fr;border-top:3px solid var(--steel)}
.cmp>div{padding:12px 16px;border-bottom:1px solid var(--line);font-size:22px;line-height:1.4}
.cmp .th{display:block;font-size:19px;color:var(--muted);margin-top:2px}
.cmp .h{font-weight:900;font-size:26px;background:var(--steel);color:#fff}
.cmp .h .th{color:#C9D3DA}
.cmp .k{font-weight:700}
.cmp .fix{color:var(--alert);font-weight:700}
.cmp .fix .th{color:var(--alert);opacity:.85}
.cmp>div.on{background:color-mix(in srgb,var(--plate) 32%,transparent)}

/* recap steps */
.steps9{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:1fr;gap:12px}
.st{display:grid;grid-template-columns:52px 1fr;gap:2px 12px;align-items:center;border:2px solid var(--line);border-radius:5px;padding:10px 14px}
.st .no{grid-row:span 2;font-size:40px;font-weight:900;color:var(--steel);text-align:center}
.st .z{font-size:25px;font-weight:900}
.st .th{font-size:18px;color:var(--muted);line-height:1.3}

/* quiz */
.quiz{flex:1;min-height:0;display:grid;grid-template-columns:480px 1fr;gap:44px}
.q-ask{font-size:34px;font-weight:900}
.q-ask .th{display:block;font-size:30px;font-weight:700;color:var(--muted);margin-top:6px}
.ans{margin-top:28px;border:3px dashed var(--line);border-radius:6px;padding:22px 26px;min-height:200px;display:flex;flex-direction:column;justify-content:center}
.ans .hide{font-size:26px;color:var(--muted)}
.ans .show{display:none}
.revealed .ans{border-style:solid;border-color:var(--ok)}
.revealed .ans .hide{display:none}
.revealed .ans .show{display:block}
.ans .a-zh{font-size:52px;font-weight:900}
.ans .a-th{font-family:var(--th);font-size:40px;font-weight:800;line-height:1.3}
.ans .a-rd{font-family:var(--th);font-size:22px;color:var(--muted);margin-top:6px}

/* controls */
#bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 12px;background:var(--steel);color:#fff}
#bar button,#bar select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:4px;
  padding:8px 14px;font-size:16px;color:#fff;cursor:pointer;min-height:42px}
#bar select option{color:#000}
#bar #play{background:var(--plate);color:var(--plate-ink);border-color:var(--plate);font-weight:900;min-width:120px}
#bar .pg{font-variant-numeric:tabular-nums;min-width:70px;text-align:center;font-size:16px}
#bar label{display:flex;align-items:center;gap:6px;font-size:15px}
#warnbar{display:none;background:var(--alert);color:#fff;font-size:15px;padding:8px 14px;text-align:center}

/* start overlay */
#start{position:fixed;inset:0;background:rgba(17,23,28,.86);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
#start .box{background:var(--surface);color:var(--ink);border-radius:8px;padding:30px 34px;max-width:560px;width:100%}
#start h2{margin:0 0 6px;font-size:28px}
#start p{margin:6px 0;color:var(--muted);line-height:1.6}
#start .go{margin-top:18px;width:100%;padding:16px;font-size:22px;font-weight:900;border:2px solid var(--plate-ink);border-radius:5px;background:var(--plate);color:var(--plate-ink);cursor:pointer}
#start .th{font-size:18px}
#start .go.rec{background:transparent;color:var(--ink);border-color:var(--line);font-size:18px;padding:12px}
body.rec #bar,body.rec #warnbar{display:none!important}
body.rec{cursor:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="warnbar"></div>
  <div id="viewport">
    <div id="stage">
      <div id="slide"></div>
      <div id="cap"><div id="count"></div><span class="chip" id="chip">▶</span><span class="txt" id="captxt">按「開始上課」，系統會自動用中文和泰文解說。</span></div>
    </div>
  </div>
  <div id="bar">
    <button id="prev" aria-label="上一頁">◀ 上一頁</button>
    <button id="play">▶ 播放</button>
    <button id="next" aria-label="下一頁">下一頁 ▶</button>
    <span class="pg" id="pg">1 / 1</span>
    <button id="again">🔁 重念這頁</button>
    <select id="mode" aria-label="解說語言">
      <option value="both">中文＋泰文</option>
      <option value="th">只念泰文</option>
      <option value="zh">只念中文</option>
    </select>
    <select id="rate" aria-label="語速">
      <option value="0.75">慢速</option>
      <option value="0.9" selected>中速</option>
      <option value="1">正常</option>
    </select>
    <label><input type="checkbox" id="auto" checked> 自動翻頁</label>
    <button id="fs">⛶ 全螢幕</button>
  </div>
</div>

<div id="start">
  <div class="box">
    <h2>P4 入料｜自動解說課</h2>
    <p class="th">บทที่ 4 การป้อนวัตถุดิบ — มีเสียงอธิบายภาษาจีนและภาษาไทยอัตโนมัติ</p>
    <p>每一頁會先念中文、再念泰文，念完自動翻頁。測驗頁會停 6 秒讓學員作答，再公布答案。</p>
    <p>點畫面上任何單字，可以單獨再念一次。空白鍵＝播放／暫停，←→＝換頁。</p>
    <button class="go" id="go">▶ 開始上課｜เริ่มเรียน</button>
    <button class="go rec" id="recgo">🎬 錄影模式：全螢幕、隱藏工具列，從第 1 頁播到最後</button>
    <p style="font-size:14px">錄影模式中按 Esc 可結束。</p>
  </div>
</div>

const $=s=>document.querySelector(s);

let idx=0, step=0, playing=false, token=0, voices={zh:null,th:null};

function pickVoices(){
  const vs=speechSynthesis.getVoices();
  const score=v=>(/natural|online|neural/i.test(v.name)?2:0)+(v.localService?0:1);
  const best=list=>list.sort((a,b)=>score(b)-score(a))[0]||null;
  voices.th=best(vs.filter(v=>/^th/i.test(v.lang)));
  voices.zh=best(vs.filter(v=>/^zh[-_]TW/i.test(v.lang)))||best(vs.filter(v=>/^zh/i.test(v.lang)||/^cmn/i.test(v.lang)));
  const miss=[]; if(!voices.th) miss.push('泰文'); if(!voices.zh) miss.push('中文');
  const w=$('#warnbar');
  if(vs.length && miss.length){w.style.display='block';w.textContent=`這台裝置沒有${miss.join('、')}語音：字幕照常顯示、照時間翻頁，但不會出聲。用 Microsoft Edge 或 Android 手機開啟可以念泰文。`;}
  else w.style.display='none';
}
if('speechSynthesis' in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices;}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rate=()=>parseFloat($('#rate').value);
const est=(lang,t)=>Math.max(1200,(lang==='th'?t.length*85:t.length*260)/rate());

function caption(lang,text){
  chip.textContent=lang==='th'?'ไทย':'中';
  chip.className='chip '+(lang==='th'?'th':'zh');
  capTxt.textContent=text; capTxt.className='txt '+(lang==='th'?'th':'');
}
function speak(lang,text,my){
  return new Promise(res=>{
    caption(lang,text);
    const v=voices[lang];
    if(!('speechSynthesis' in window)||!v){ setTimeout(res,est(lang,text)); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.voice=v; u.lang=v.lang; u.rate=rate()*(lang==='th'?0.95:1);
    let done=false; const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin; u.onerror=fin;
    setTimeout(fin,est(lang,text)*2.5+4000);
    speechSynthesis.speak(u);
  });
}
function hl(id){
  slideEl.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  if(id){const e=slideEl.querySelector('#'+id); if(e) e.classList.add('on');}
}
function allowed(st){
  const m=$('#mode').value;
  if(st.zh!==undefined) return m!=='th';
  if(st.th!==undefined) return m!=='zh';
  return true;
}
async function run(){
  const my=++token; playing=true; setPlayBtn();
  const steps=S[idx].say;
  while(step<steps.length){
    if(my!==token) return;
    const st=steps[step];
    if(allowed(st)){
      if(st.hl!==undefined) hl(st.hl);
      if(st.wait){
        countEl.style.display='flex';
        for(let s=Math.round(st.wait/1000);s>0;s--){ if(my!==token){countEl.style.display='none';return;} countEl.textContent=s; await sleep(1000); }
        countEl.style.display='none';
      } else if(st.act==='reveal'){ stage.classList.add('revealed'); }
      else if(st.zh!==undefined) await speak('zh',st.zh,my);
      else if(st.th!==undefined) await speak('th',st.th,my);
      if(my!==token) return;
      await sleep(350);
    }
    step++;
  }
  if(my!==token) return;
  hl(null);
  if($('#auto').checked && idx<S.length-1){ await sleep(1200); if(my===token){ go(idx+1,true); } }
  else if(document.body.classList.contains('rec')){ caption('zh','— 完 ｜ จบ —'); playing=false; }
  else { playing=false; setPlayBtn(); }
}
function stopSpeech(){ token++; if('speechSynthesis' in window) speechSynthesis.cancel(); countEl.style.display='none'; }
function render(){
  stage.classList.remove('revealed');
  slideEl.innerHTML=S[idx].html;
  $('#pg').textContent=`${idx+1} / ${S.length}`;
  slideEl.querySelectorAll('[data-say]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation(); stopSpeech(); playing=false; setPlayBtn();
    const my=token; const m=$('#mode').value;
    (async()=>{ if(m!=='zh') await speak('th',el.dataset.th,my); if(my!==token) return; if(m!=='th'){ await sleep(250); await speak('zh',el.dataset.zh,my);} })();
  }));
}
function go(n,keepPlaying){
  if(n<0||n>=S.length) return;
  stopSpeech(); idx=n; step=0; render();
  if(keepPlaying||playing) run(); else { setPlayBtn(); }
}
function setPlayBtn(){ $('#play').textContent=playing?'⏸ 暫停':'▶ 播放'; }
function toggle(){
  if(playing){ stopSpeech(); playing=false; setPlayBtn(); }
  else { const steps=S[idx].say; if(step>=steps.length) step=0; run(); }
}

$('#prev').onclick=()=>go(idx-1);
$('#next').onclick=()=>go(idx+1);
$('#play').onclick=toggle;
$('#again').onclick=()=>{ stopSpeech(); step=0; stage.classList.remove('revealed'); run(); };
$('#mode').onchange=$('#rate').onchange=()=>{};
$('#fs').onclick=()=>{ const d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);} else document.exitFullscreen(); };
$('#go').onclick=()=>{
  $('#start').style.display='none';
  if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); pickVoices(); }
  run();
};
$('#recgo').onclick=()=>{
  document.body.classList.add('rec'); $('#auto').checked=true; $('#start').style.display='none';
  const d=document.documentElement; (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);
  if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); pickVoices(); }
  stopSpeech(); idx=0; step=0; render(); setTimeout(()=>{fit(); run();},1500);
};
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('rec'); setTimeout(fit,100); });
document.addEventListener('keydown',e=>{
  if($('#start').style.display!=='none') return;
  if(e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight') go(idx+1);
  else if(e.key==='ArrowLeft') go(idx-1);
});

function fit(){
  const vp=$('#viewport'); const s=Math.min(vp.clientWidth/1280, vp.clientHeight/720);
  stage.style.transform=`scale(${s})`;
}
addEventListener('resize',fit); new ResizeObserver(fit).observe($('#viewport'));
render(); fit();
</script>
</body>
</html>
