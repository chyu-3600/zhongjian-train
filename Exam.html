<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>考試刷題衝刺｜通用版</title>
<style>
:root{
  --bg:#f3f5f9;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#2563eb;
  --primary-dark:#1e40af;
  --primary-soft:#eff6ff;
  --ok:#047857;
  --ok-soft:#ecfdf5;
  --warn:#b45309;
  --warn-soft:#fffbeb;
  --danger:#b91c1c;
  --danger-soft:#fef2f2;
  --line:#e5e7eb;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --shadow-sm:0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none !important}
#app{
  max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative;
}
#topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
#statusbar{height:env(safe-area-inset-top)}
#navbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;min-height:56px;position:relative}
#nav-title{
  font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;flex:1;min-width:0;text-align:center;
  padding:0 76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-btn{
  border:0;background:transparent;color:var(--primary);font-size:15px;font-weight:600;
  padding:8px 4px;min-width:44px;min-height:44px;text-align:left;
  display:inline-flex;align-items:center;
}
#nav-back{position:absolute;left:16px;top:50%;transform:translateY(-50%);min-width:0;z-index:1}
main#view{padding:16px 16px 28px;display:block}
.card{
  background:var(--card);border-radius:18px;padding:16px;
  box-shadow:var(--shadow-sm);border:1px solid rgba(229,231,235,.8);margin-bottom:14px;
}
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 52%,#0891b2 100%);
  color:#fff;box-shadow:var(--shadow);margin-bottom:16px;
}
.hero::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.12);right:-70px;top:-90px;
}
.hero-badge{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;
  background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px;margin-bottom:10px;
}
.hero h2{margin:0 0 6px;font-size:23px;line-height:1.35;font-weight:800}
.hero p{margin:0;font-size:14px;opacity:.92}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 2px 12px}
.page-head h2{font-size:19px;margin:0;font-weight:800}
.page-head .sub{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:99px;white-space:nowrap;
}
.badge.open{background:var(--ok-soft);color:var(--ok)}
.badge.before{background:var(--primary-soft);color:var(--primary-dark)}
.badge.after{background:var(--danger-soft);color:var(--danger)}
.badge.unset,.badge.invalid{background:var(--warn-soft);color:var(--warn)}
.badge.gray{background:#f1f5f9;color:#475569}
.exam-card .exam-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.exam-card h3{margin:0;font-size:16px;font-weight:800}
.time-list{display:grid;gap:6px;margin:10px 0 12px}
.time-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.time-row:last-child{border-bottom:0}
.time-row span:first-child{color:var(--muted)}
.time-row span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.countdown-box{
  background:var(--primary-soft);border:1px solid #dbeafe;border-radius:12px;
  padding:10px 12px;text-align:center;margin-bottom:12px;font-size:13px;color:var(--primary-dark);
}
.countdown-box strong{display:block;font-size:23px;letter-spacing:2px;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--primary-dark)}
.countdown-box.danger{background:var(--danger-soft);border-color:#fecaca;color:var(--danger)}
.countdown-box.danger strong{color:var(--danger)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:12px;padding:10px 16px;
  font-size:15px;font-weight:700;background:#f1f5f9;color:var(--text);
  transition:transform .06s ease,background .15s ease,opacity .15s ease;
  min-height:44px;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.success{background:var(--ok);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn.soft{background:var(--primary-soft);color:var(--primary-dark)}
.btn.text{background:transparent;color:var(--muted);font-weight:600;min-height:40px}
.btn.block{width:100%}
.btn.small{padding:7px 11px;min-height:36px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 120px;min-width:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid rgba(229,231,235,.9);border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat .num{font-size:21px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px}
.section-title{font-size:14px;font-weight:800;color:#334155;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title:first-child{margin-top:0}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:#fff;color:#475569;border-radius:99px;
  padding:6px 13px;font-size:13px;white-space:nowrap;font-weight:600;min-height:36px;
  display:inline-flex;align-items:center;
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.q-list{display:grid;gap:9px}
.q-item{
  width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
  background:#fff;border:1px solid rgba(229,231,235,.9);border-radius:14px;padding:12px;
  box-shadow:var(--shadow-sm);
}
.q-num{
  flex:0 0 28px;height:28px;border-radius:9px;background:var(--primary-soft);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px;
}
.q-main{flex:1;min-width:0}
.q-text{font-size:14px;font-weight:600;line-height:1.55;display:block}
.q-sub{font-size:12px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;border-radius:6px;padding:1px 7px}
.option{
  width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px;
  margin-bottom:9px;transition:border-color .15s,background .15s;
}
.option:hover{border-color:#bfdbfe}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.correct{border-color:#6ee7b7;background:var(--ok-soft)}
.option.wrong{border-color:#fca5a5;background:var(--danger-soft)}
.option-key{
  flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid #cbd5e1;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#475569;
}
.option.selected .option-key{background:var(--primary);border-color:var(--primary);color:#fff}
.option.correct .option-key{background:var(--ok);border-color:var(--ok);color:#fff}
.option.wrong .option-key{background:var(--danger);border-color:var(--danger);color:#fff}
.option > span:last-child{flex:1;min-width:0;font-size:14px;line-height:1.55;padding-top:1px;overflow-wrap:anywhere}
.open-answer{
  width:100%;min-height:170px;border:1.5px solid var(--line);border-radius:14px;padding:12px;
  font-size:16px;line-height:1.7;background:#fff;resize:vertical;outline:none;font-family:inherit;
}
.open-answer:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.answer-box{
  background:var(--ok-soft);border:1px solid #a7f3d0;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;
}
.answer-box strong{color:var(--ok)}
.answer-box p{margin:6px 0 0;color:#334155;font-size:13.5px}
.quiz-top{margin-bottom:12px}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.mode-tag{font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:2px 9px;border-radius:99px;font-size:12px}
.progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:99px;transition:width .2s ease}
.exam-timer{margin-top:10px;font-size:13px;color:var(--warn);text-align:right}
.exam-timer strong{font-size:16px;font-variant-numeric:tabular-nums}
.exam-timer.danger{color:var(--danger)}
.question-card h3{font-size:17px;line-height:1.6;margin:10px 0 14px;font-weight:700}
.quiz-actions{display:flex;gap:10px;margin-top:4px}
.quiz-actions .btn{flex:1}
.question-card .q-cat-tag{font-size:12px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);display:inline-block;padding:2px 9px;border-radius:99px}
.result-top{text-align:center;padding:8px 0 4px}
.score-ring{
  width:132px;height:132px;border-radius:50%;margin:0 auto 12px;
  background:conic-gradient(var(--primary) calc(var(--pct) * 1%), #e5e7eb 0);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.score-ring::before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.score-ring .inner{position:relative;text-align:center}
.score-ring .score{font-size:31px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.score-ring .score small{font-size:13px;color:var(--muted);font-weight:600}
.score-ring .pct{font-size:12px;color:var(--muted)}
.result-title{font-size:18px;font-weight:800;margin:0 0 4px}
.result-sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.result-stats .item{background:#f8fafc;border-radius:12px;padding:9px 6px;text-align:center}
.result-stats .v{font-weight:800;font-size:17px}
.result-stats .k{font-size:11.5px;color:var(--muted)}
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.wrong-item .wq{font-weight:700;font-size:14px;margin-bottom:6px}
.wrong-item .wa{font-size:13px;color:var(--muted);line-height:1.7}
.wrong-item .wa b{color:var(--ok)}
.open-review{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.open-answer-text{margin-top:8px;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.open-reference{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.admin-comment{margin-top:8px;padding:10px;background:var(--primary-soft);border:1px solid #bfdbfe;border-radius:10px;font-size:13.5px}
.admin-comment strong{color:var(--primary-dark);font-size:12.5px}
.admin-comment p{margin:4px 0 0;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.admin-comment.pending{background:#f8fafc;border-color:var(--line);color:var(--muted)}
.form{display:grid;gap:13px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:700;color:#334155}
.field .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
  background:#fff;outline:none;font-size:15px;min-height:44px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.field .hint{font-size:12px;color:var(--muted)}
.form-error{
  display:none;background:var(--danger-soft);border:1px solid #fecaca;color:var(--danger);
  border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;
}
.form-error.show{display:block}
.notice{
  background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;
  border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;overflow-wrap:anywhere;
}
.notice.blue{background:var(--primary-soft);border-color:#bfdbfe;color:#1e40af}
.profile-line{display:flex;align-items:center;gap:12px}
.avatar{
  width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 48px;
}
.profile-line .name{font-weight:800;font-size:16px}
.profile-line .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.menu-list{display:grid;gap:0;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:14px 15px;background:#fff;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;font-weight:600;
}
.menu-item:last-child{border-bottom:0}
.menu-item .chev{color:#94a3b8;font-size:18px;line-height:1}
.menu-item.danger{color:var(--danger)}
.list{display:grid;gap:8px}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
.list-row .main{min-width:0}
.list-row .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .s{font-size:12px;color:var(--muted);margin-top:1px}
.attempt-row{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.q-admin-row{align-items:flex-start}
.q-admin-row .t{white-space:normal;overflow-wrap:anywhere;line-height:1.55}
.q-admin-row .row-actions{display:flex;gap:2px;flex:0 0 auto}
.q-details{margin-top:2px}
.q-details summary{
  list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-size:14px;font-weight:700;
}
.q-details summary::-webkit-details-marker{display:none}
.q-details summary::after{content:'展開';font-size:12px;color:var(--primary);font-weight:700}
.q-details[open] summary::after{content:'收起'}
.q-details[open] summary{margin-bottom:8px}
.review-item{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.review-item summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:#f8fafc;border-radius:12px;font-size:13.5px;font-weight:700}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary span:first-child{min-width:0;overflow-wrap:anywhere}
.review-item[open]{padding-bottom:2px}
.review-item[open] summary{border-radius:12px 12px 0 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.review-answer{padding:0 12px 4px}
.review-label{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:#334155}
.review-textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.7;resize:vertical;font-family:inherit}
.review-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.review-item > .btn{width:calc(100% - 24px);margin:10px 12px 12px}
.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.admin-head h2{font-size:19px;margin:0}
.admin-tag{font-size:12px;color:var(--muted)}
.admin-card h3{font-size:15px;margin:0 0 4px;font-weight:800}
.admin-card .desc{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:18px 10px;background:#f8fafc;border-radius:12px;border:1px dashed var(--line)}
.gate-card h3{font-size:16px;line-height:1.6;margin:12px 0 6px}
.q-image-btn{display:block;width:100%;border:0;background:transparent;padding:0;margin:0 0 14px;text-align:left}
.q-image{display:block;width:100%;max-height:360px;object-fit:contain;background:#f8fafc;border:1px solid var(--line);border-radius:12px;cursor:zoom-in}
.q-image.compact{max-height:190px;margin-bottom:8px}
.q-image-full{display:block;width:100%;max-height:70vh;max-height:70dvh;object-fit:contain;background:#f8fafc;border-radius:12px}
.image-field input[type="file"]{width:100%;padding:10px;font-size:13px;min-height:48px;background:#f8fafc;border:1.5px dashed var(--line);border-radius:12px}
.image-preview{display:none;margin-top:8px;padding:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
.image-preview.show{display:block}
.image-preview img{display:block;width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#fff}
.image-preview .btn{margin-top:6px}
.choice-fields{display:grid;gap:13px}
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;
}
.tab-item{
  border:0;background:transparent;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;font-size:11px;font-weight:600;position:relative;
}
.tab-item.active{color:var(--primary)}
.tab-icon svg{width:21px;height:21px;fill:currentColor;display:block}
.tab-badge{
  position:absolute;top:0;right:calc(50% - 20px);background:var(--danger);color:#fff;border-radius:99px;
  min-width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .16s ease;
}
.modal{
  width:100%;max-width:420px;max-height:86vh;max-height:86dvh;overflow:auto;background:#fff;border-radius:20px;
  padding:20px;position:relative;box-shadow:0 30px 60px rgba(15,23,42,.3);
  animation:popIn .18s ease;overscroll-behavior:contain;
}
.modal h3{margin:0 0 12px;font-size:18px;font-weight:800;padding-right:48px}
.modal p{margin:0 0 12px}
.modal-close{
  position:absolute;top:8px;right:8px;border:0;background:#f1f5f9;color:#475569;
  width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
}

    });
  }

    if(!ts) return '未設定';

  /* ============ 雲端同步（Supabase tool_storage，ES5 XHR）============ */
  function sbDirect(method, path, body, headers, cb){
    var xhr = new XMLHttpRequest();
    var fin = false, t0 = Date.now();
    function done(ok, status, json, err){
      if(fin) return;
      fin = true;
      cb({ ok: ok, status: status, json: json, ms: Date.now() - t0, err: err || '' });
    }
    try{
      xhr.open(method, SB_URL + path, true);
      xhr.setRequestHeader('apikey', SB_ANON);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SB_ANON);
      if(headers){
        for(var k in headers){
          if(headers.hasOwnProperty(k)) xhr.setRequestHeader(k, headers[k]);
        }
      }
      xhr.timeout = 25000;
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        var json = null;
        try{ json = JSON.parse(xhr.responseText); }catch(e){}
        done(xhr.status >= 200 && xhr.status < 300, xhr.status, json, '');
      };
      xhr.ontimeout = function(){ done(false, 0, null, '逾時'); };
      xhr.onerror   = function(){ done(false, 0, null, '網路錯誤'); };
      xhr.send(body === null || body === undefined ? null : body);
    }catch(e){
      done(false, 0, null, 'XHR:' + e.message);
    }
  }

  function cloudPack(){
    return {
      v: 1,
      exam: db.exam,
      admins: db.admins,
      questions: db.questions,
      registrations: db.registrations,
      attempts: db.attempts,
      wrongIds: db.wrongIds,
      deleted: db.deleted || {}
    };
  }

  function stamp(x){
    if(!x || typeof x !== 'object') return '';
    return x.updatedAt || x.createdAt || x.at || '';
  }
  function mergeArr(local, remote){
    if(!Array.isArray(local)) local = [];
    if(!Array.isArray(remote)) remote = [];
    var map = {};
    function put(x){
      if(!x || !x.id) return;
      var old = map[x.id];
      if(!old || stamp(x) >= stamp(old)) map[x.id] = x;
    }
    local.forEach(put);
    remote.forEach(put);
    var out = [];
    for(var id in map){ if(map.hasOwnProperty(id)) out.push(map[id]); }
    return out;
  }
  function cleanDead(arr, dead){
    if(!Array.isArray(dead)) return arr || [];
    return (arr || []).filter(function(x){ return x && dead.indexOf(x.id) < 0; });
  }
  function mergeCloud(cloud){
    if(!cloud || typeof cloud !== 'object') return false;
    var before = JSON.stringify(cloudPack());
    var del = db.deleted || {};
    var cdel = cloud.deleted || {};
    ['questions','admins','registrations','attempts','wrongIds'].forEach(function(k){
      var arr = cdel[k];
      if(!Array.isArray(arr)) return;
      if(!Array.isArray(del[k])) del[k] = [];
      arr.forEach(function(id){ if(del[k].indexOf(id) < 0) del[k].push(id); });
    });
    db.deleted = del;
    db.questions    = cleanDead(mergeArr(db.questions, cloud.questions), del.questions);
    db.admins       = cleanDead(mergeArr(db.admins, cloud.admins), del.admins);
    db.registrations= cleanDead(mergeArr(db.registrations, cloud.registrations), del.registrations);
    db.attempts     = cleanDead(mergeArr(db.attempts, cloud.attempts), del.attempts);
    var wv = mergeArr(
      (db.wrongIds || []).map(function(id){ return {id:id}; }),
      (cloud.wrongIds || []).map(function(id){ return {id:id}; })
    ).map(function(x){ return x.id; });
    db.wrongIds = cleanDead(wv, del.wrongIds);
    if(!db.admins.length) db.admins = defaultDB().admins;
    if(cloud.exam && stamp(cloud.exam) >= stamp(db.exam)) db.exam = cloud.exam;
    QUESTIONS = db.questions;
    var after = JSON.stringify(cloudPack());
    return before !== after;
  }

  function cloudTime(){
    try{ return new Date().toLocaleTimeString('zh-TW', {hour12:false}); }catch(e){ return ''; }
  }
  function cloudPull(cb){
    if(cloudPulling){ if(cb) cb(false); return; }
    cloudPulling = true;
    sbDirect('GET', '/rest/v1/tool_storage?key=eq.' + SB_KEY + '&select=data',
      null, null, function(r){
        cloudPulling = false;
        if(!r.ok || !r.json || !r.json.length || !r.json[0].data){
          cloudStatus = '讀取失敗（本機資料仍可用）';
          if(cb) cb(false);
          return;
        }
        var changed = mergeCloud(r.json[0].data);
        if(changed) saveLocal();
        cloudStatus = '雲端已同步 ' + cloudTime();
        cloudLastOk = Date.now();
        if(cb) cb(true);
      });
  }
  function cloudPush(){
    var pack = cloudPack();
    sbDirect('PATCH', '/rest/v1/tool_storage?key=eq.' + SB_KEY,
      JSON.stringify({ data: pack }),
      { 'Content-Type':'application/json', 'Prefer':'return=representation' },
      function(r){
        if(r.ok && r.json && r.json.length){
          cloudStatus = '雲端已備份 ' + cloudTime();
          cloudLastOk = Date.now();
          return;
        }
        var needCreate = !r.ok || r.status === 404 || r.status === 406 || r.status === 400;
        if(needCreate){
          sbDirect('POST', '/rest/v1/tool_storage',
            JSON.stringify({ key: SB_KEY, data: pack }),
            { 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=representation' },
            function(r2){
              cloudStatus = r2.ok ? ('雲端已備份 ' + cloudTime()) : '雲端備份失敗（本機資料仍在）';
              if(r2.ok) cloudLastOk = Date.now();
            });
        }else{
          cloudStatus = '雲端備份失敗（本機資料仍在）';
        }
      });
  }
  function schedulePush(){
    if(cloudTimer) clearTimeout(cloudTimer);
    cloudTimer = setTimeout(function(){ cloudTimer = null; cloudPush(); }, 900);
  }

  function examStatus(){
    var s = db.exam.startAt ? new Date(db.exam.startAt).getTime() : NaN;
    var e = db.exam.endAt ? new Date(db.exam.endAt).getTime() : NaN;
    if(isNaN(s) || isNaN(e)){
      return {code:'unset',text:'未設定考試時間',detail:'請由管理員設定考試開始與結束時間。'};
    }
    if(e <= s){
      return {code:'invalid',text:'考試時間設定有誤',detail:'結束時間必須晚於開始時間，請管理員重新設定。'};
    }
    var now = Date.now();
    if(now < s){
      return {code:'before',text:'尚未開始',detail:'考試將於 '+fmt(s)+' 開始。'};
    }
    if(now >= e){
      return {code:'after',text:'已結束',detail:'考試已於 '+fmt(e)+' 結束。'};
    }
    return {code:'open',text:'進行中',detail:'考試開放到 '+fmt(e)+'。'};
  }
  function bestExamResult(){
    var exams = db.attempts.filter(function(a){ return a.mode === 'exam' && (a.total || 0) > 0; });
    if(!exams.length) return null;
    return exams.reduce(function(best,a){
      if(!best) return a;
      return (a.score/a.total) > (best.score/best.total) ? a : best;
    }, null);
  }

  function renderQuiz(){
    var qz = state.quiz;
    if(!qz) return '<div class="empty">尚未開始測驗。</div>';
    if(!currentProfile()){
      state.quiz = null;
      return gateHtml('作答','完成報名後才能作答。');
    }
    var q = QUESTIONS.filter(function(x){ return x.id === qz.ids[qz.index]; })[0];
    if(!q) return '<div class="empty">題目不存在。</div>';
    var total = qz.ids.length;
    var picked = qz.answers[q.id];
    var modeLabel = qz.mode === 'exam' ? '正式測驗' : qz.mode === 'wrong' ? '錯題練習' : '隨機練習';
    var html = '';

    html += '<div class="quiz-top">';
    html += '  <div class="quiz-meta"><span>第 '+(qz.index+1)+' / '+total+' 題</span><span class="mode-tag">'+modeLabel+'</span></div>';
    html += '  <div class="progress"><span style="width:'+Math.round((qz.index+1)/total*100)+'%"></span></div>';
    if(qz.mode === 'exam'){
      html += '  <div class="exam-timer" data-exam-timer-wrap>剩餘時間 <strong data-exam-timer>--:--:--</strong></div>';
    }
    html += '</div>';

    html += '<div class="card question-card">';
    html += '  <span class="q-cat-tag">'+esc(q.cat)+(q.type === 'open' ? '・自由作答' : '')+'</span>';
    html += '  <h3>'+esc(q.q)+'</h3>';
    html += questionImageHtml(q);
    if(q.type === 'open'){
      html += '  <textarea class="open-answer" data-open-answer="'+esc(q.id)+'" maxlength="2000" placeholder="請輸入你的想法…">'+esc(typeof picked === 'string' ? picked : '')+'</textarea>';
      html += '  <p class="small muted" style="margin:8px 0 0">這題不計分，交卷後由管理員填寫講評。</p>';
    }else{
      html += '  <div>';
      q.opts.forEach(function(o,idx){
        html += '<button class="option '+(picked === idx ? 'selected' : '')+'" type="button" data-action="pick" data-value="'+idx+'">';
        html += '  <span class="option-key">'+LETTERS[idx]+'</span><span>'+esc(o)+'</span>';
        html += '</button>';
      });
      html += '  </div>';
    }
    html += '</div>';

    html += '<div class="quiz-actions">';
    html += '  <button class="btn ghost" type="button" data-action="quiz-prev" '+(qz.index === 0 ? 'disabled' : '')+'>上一題</button>';
    if(qz.index < total-1){
      html += '  <button class="btn primary" type="button" data-action="quiz-next">下一題</button>';
    }else{
      html += '  <button class="btn success" type="button" data-action="quiz-submit">交卷</button>';
    }
    html += '</div>';
    html += '<button class="btn text block" type="button" data-action="quiz-exit">退出作答</button>';
    return html;
  }

  function renderResult(){
    var r = state.result;
    if(!r) return '<div class="empty">尚無測驗結果。</div>';
    var attempt = r.attemptId ? db.attempts.filter(function(a){ return a.id === r.attemptId; })[0] : null;
    var choiceTotal = attempt ? (attempt.choiceTotal != null ? attempt.choiceTotal : (attempt.total || 0)) : (r.total || 0);
    var openAnswers = attempt && Array.isArray(attempt.openAnswers) ? attempt.openAnswers : [];
    var openTotal = openAnswers.length;
    var score = attempt ? attempt.score : (r.score || 0);
    var unanswered = attempt && attempt.unanswered != null ? attempt.unanswered : (r.unanswered || 0);
    var hasChoice = choiceTotal > 0;
    var pct = hasChoice ? Math.round(score / choiceTotal * 100) : 0;
    var wrongList = r.wrongList || [];
    if(attempt && Array.isArray(attempt.wrongAnswers)){
      wrongList = attempt.wrongAnswers.map(function(w){
        var q = QUESTIONS.filter(function(x){ return x.id === w.qid; })[0];
        return q ? {q:q, picked:w.picked} : null;
      }).filter(Boolean);
    }
    var pendingComments = openAnswers.filter(function(a){ return !a.comment || !a.comment.trim(); }).length;
    var reviewed = openTotal > 0 && pendingComments === 0;

    var html = '';
    html += '<div class="card result-top">';
    if(hasChoice){
      html += '  <div class="score-ring" style="--pct:'+pct+'"><div class="inner"><div class="score">'+score+'<small> / '+choiceTotal+'</small></div><div class="pct">得分率 '+pct+'%</div></div></div>';
    }else{
      html += '  <div class="score-ring" style="--pct:0"><div class="inner"><div class="score">完成</div><div class="pct">自由作答 '+openTotal+' 題</div></div></div>';
    }
    html += '  <p class="result-title">'+(!hasChoice ? '自由作答已完成' : pct >= 80 ? '表現優異' : pct >= 60 ? '順利完成' : '再加油一下')+'</p>';
    html += '  <p class="result-sub">'+(r.mode === 'exam' ? '正式測驗' : '練習模式')+'・用時 '+r.duration+(openTotal ? (hasChoice ? '・成績僅計算選擇題' : '・本次不計分') : '')+'</p>';
    html += '  <div class="result-stats">';
    if(hasChoice){
      html += '    <div class="item"><div class="v">'+score+'</div><div class="k">答對</div></div>';
      html += '    <div class="item"><div class="v">'+Math.max(0, choiceTotal - score - unanswered)+'</div><div class="k">答錯</div></div>';
      html += '    <div class="item"><div class="v">'+unanswered+'</div><div class="k">未作答</div></div>';
    }else{
      html += '    <div class="item"><div class="v">'+openTotal+'</div><div class="k">自由作答</div></div>';
      html += '    <div class="item"><div class="v">'+pendingComments+'</div><div class="k">待講評</div></div>';
      html += '    <div class="item"><div class="v">'+(openTotal - pendingComments)+'</div><div class="k">已講評</div></div>';
    }
    html += '  </div>';
    if(openTotal){
      html += '  <div class="notice blue" style="margin-top:12px;text-align:left">另有 '+openTotal+' 題自由作答，<b>不列入分數</b>；'+(reviewed ? '管理員已完成講評。' : '尚有 '+pendingComments+' 題待管理員講評。')+'</div>';
    }
    html += '</div>';

    if(openTotal){
      html += '<div class="section-title">自由作答與講評</div>';
      openAnswers.forEach(function(oa){
        var q = QUESTIONS.filter(function(x){ return x.id === oa.qid; })[0];
        if(!q) return;
        html += '<div class="open-review">';
        html += '  <div class="wq">'+esc(q.q)+'</div>';
        html += questionImageHtml(q, 'compact');
        html += '  <div class="open-answer-text">你的作答：'+(oa.answer && oa.answer.trim() ? '<span>'+esc(oa.answer)+'</span>' : '<span class="muted">未作答</span>')+'</div>';
        if(q.exp) html += '  <div class="open-reference">參考方向：'+esc(q.exp)+'</div>';
        if(oa.comment && oa.comment.trim()){
          html += '  <div class="admin-comment"><strong>管理員講評</strong><p>'+esc(oa.comment)+'</p></div>';
        }else{
          html += '  <div class="admin-comment pending"><strong>管理員講評</strong><p>待管理員講評</p></div>';
        }
        html += '</div>';
      });
    }

    if(wrongList.length){
      html += '<div class="section-title">答錯題目</div>';
      wrongList.forEach(function(item){
        html += '<div class="wrong-item">';
        html += '  <div class="wq">'+esc(item.q.q)+'</div>';
        html += questionImageHtml(item.q, 'compact');
        html += '  <div class="wa">你的答案：'+(item.picked == null ? '未作答' : LETTERS[item.picked]+'．'+esc(item.q.opts[item.picked]))+'<br>正確答案：<b>'+LETTERS[item.q.ans]+'．'+esc(item.q.opts[item.q.ans])+'</b></div>';
        html += '  <div class="wa" style="margin-top:5px">'+esc(item.q.exp)+'</div>';
        html += '</div>';
      });
    }

    html += '<div class="btn-row" style="margin-top:14px">';
    html += '  <button class="btn primary" type="button" data-action="go" data-value="home">返回首頁</button>';
    html += '  <button class="btn ghost" type="button" data-action="go" data-value="wrong">查看錯題本</button>';
    html += '</div>';
    html += '<button class="btn text block" type="button" data-action="retry">再測一次</button>';
    return html;
  }

  /* ============ 主渲染 ============ */
  function render(){
    var titles = {home:'考試刷題衝刺',library:'題庫',wrong:'錯題本',random:'隨機練習',mine:'我的'};
    var title = state.view === 'quiz' ? '作答中' :
                state.view === 'admin' ? '管理後台' :
                state.view === 'result' ? '測驗結果' :
                state.view === 'register' ? '報名資料' : titles[state.tab];
    document.getElementById('nav-title').textContent = title;
    document.getElementById('nav-back').classList.toggle('hidden', !(state.view === 'quiz' || state.view === 'admin' || state.view === 'result' || state.view === 'register'));
    document.getElementById('tabbar').classList.toggle('hidden', state.view === 'quiz');

    document.querySelectorAll('.tab-item').forEach(function(btn){
      btn.classList.toggle('active', state.view === 'main' && btn.getAttribute('data-tab') === state.tab);
    });
    var badge = document.getElementById('wrong-badge');
    if(db.wrongIds.length){
      badge.textContent = db.wrongIds.length > 99 ? '99+' : db.wrongIds.length;
      badge.classList.remove('hidden');
    }else{
      badge.classList.add('hidden');
    }

    var view = document.getElementById('view');
    if(state.view === 'quiz') view.innerHTML = renderQuiz();
    else if(state.view === 'result') view.innerHTML = renderResult();
    else if(state.view === 'admin') view.innerHTML = renderAdmin();
    else if(state.view === 'register') view.innerHTML = renderRegister();
    else if(state.tab === 'home') view.innerHTML = renderHome();
    else if(state.tab === 'library') view.innerHTML = renderLibrary();
    else if(state.tab === 'wrong') view.innerHTML = renderWrong();
    else if(state.tab === 'random') view.innerHTML = renderRandom();

    window.scrollTo(0,0);

  function updateCountdowns(){
    document.querySelectorAll('[data-countdown]').forEach(function(el){
      var target = Number(el.getAttribute('data-countdown'));
      el.textContent = countdownText(target);
    });
    var examTimer = document.querySelector('[data-exam-timer]');
    if(examTimer){
      var left = new Date(db.exam.endAt).getTime() - Date.now();
      examTimer.textContent = countdownText(new Date(db.exam.endAt).getTime());

  function startQuiz(mode){
    var p = currentProfile();
    if(!p){
      toast('請先完成報名並填寫姓名，才能查看題目');
      state.view = 'register';
      render();
      return;
    }
    if(mode === 'exam'){
      var st = examStatus();
      if(st.code !== 'open'){
        toast(st.code === 'before' ? '考試尚未開始' : st.code === 'after' ? '考試已結束' : st.text);
        state.view = 'main';
        state.tab = 'home';
        render();
        return;
      }
    }
    var ids;
    if(mode === 'exam') ids = QUESTIONS.map(function(q){ return q.id; });
    else if(mode === 'wrong') ids = db.wrongIds.filter(function(id){ return QUESTIONS.some(function(q){ return q.id === id; }); });
    else ids = shuffle(QUESTIONS.map(function(q){ return q.id; })).slice(0, 10);
    if(!ids.length){ toast('目前沒有可練習的題目'); return; }
    state.quiz = {mode:mode,ids:ids,index:0,answers:{},startedAt:Date.now(),submitted:false};
    state.view = 'quiz';
    render();
  }

  function submitQuiz(auto){
    var qz = state.quiz;
    if(!qz || qz.submitted) return;
    qz.submitted = true;

    var correct = 0, wrongList = [], unanswered = 0, choiceTotal = 0, openAnswers = [];
    qz.ids.forEach(function(id){
      var q = QUESTIONS.filter(function(x){ return x.id === id; })[0];
      if(!q) return;
      if(q.type === 'open'){
        var text = qz.answers[id];
        openAnswers.push({qid:id, answer: typeof text === 'string' ? text : '', comment:''});
        return;
      }
      choiceTotal++;
      var picked = qz.answers[id];
      if(picked == null){
        unanswered++;
        wrongList.push({q:q,picked:null});
      }else if(picked === q.ans){
        correct++;
      }else{
        wrongList.push({q:q,picked:picked});
        if(db.wrongIds.indexOf(id) < 0) db.wrongIds.push(id);
      }
    });

    var elapsed = Math.max(0, Math.floor((Date.now() - qz.startedAt)/1000));
    var duration = pad(Math.floor(elapsed/60))+':'+pad(elapsed%60);
    var profile = currentProfile();
    var attempt = {
      id: uid('att'),
      mode: qz.mode,
      name: profile ? profile.name : '訪客',
      score: correct,
      total: choiceTotal,
      choiceTotal: choiceTotal,
      openTotal: openAnswers.length,
      correctChoice: correct,
      openAnswers: openAnswers,
      reviewStatus: openAnswers.length ? 'pending' : 'none',
      wrongAnswers: wrongList.map(function(w){ return {qid:w.q.id, picked:w.picked}; }),
      unanswered: unanswered,
      at: new Date().toISOString(),
      duration: duration
    };
    db.attempts.push(attempt);
    saveDB();

    state.result = {
      attemptId: attempt.id,
      mode: qz.mode,
      duration: duration,
      wrongList: wrongList,
      unanswered: unanswered
    };
    state.quiz = null;
    state.view = 'result';
    render();
    toast(auto ? '時間到，系統已自動交卷' : '已交卷，成績已儲存');
  }

  function dataUrlToBlob(dataUrl){
    var parts = String(dataUrl).split(',');
    if(parts.length < 2) return null;
    var mimeMatch = parts[0].match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var bin = atob(parts[1]);
    var n = bin.length;
    var u8 = new Uint8Array(n);
    while(n--){ u8[n] = bin.charCodeAt(n); }
    return new Blob([u8], { type: mime });
  }
  function uploadQuestionImage(dataUrl, cb){
    var blob = dataUrlToBlob(dataUrl);
    if(!blob){ cb(null); return; }
    var path = 'exam/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.jpg';
    sbDirect('POST', '/storage/v1/object/media/' + path, blob,
      { 'Content-Type':'image/jpeg', 'x-upsert':'true' },
      function(r){
        if(!r.ok){ cb(null); return; }
        cb(SB_URL + '/storage/v1/object/public/media/' + path);
      });
  }

  function compressQuestionImage(file, done){
    var reader = new FileReader();
    reader.onerror = function(){ done(null); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ done(null); };
      img.onload = function(){
        function render(maxSide, quality){
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var width = Math.max(1, Math.round(img.width * scale));
          var height = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          return canvas.toDataURL('image/jpeg', quality);
        }
        var data = render(1400, 0.82);
        if(data.length > 600000) data = render(1100, 0.72);
        if(data.length > 900000) data = render(900, 0.65);
        done(data.length > 950000 ? null : data);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* ============ 事件 ============ */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    var value = el.getAttribute('data-value');

    if(action === 'modal-mask'){
      if(e.target === el) closeModal();
      return;
    }
    if(action === 'close-modal'){ closeModal(); return; }
    if(action === 'confirm-ok'){
      var cb = confirmCallback;
      confirmCallback = null;
      closeModal();
      if(cb) cb();
      return;
    }
    if(action === 'tab'){ state.tab = value; state.view = 'main'; render(); return; }
    if(action === 'back'){
      if(state.view === 'quiz'){
        confirmDialog('退出作答', '確定要退出嗎？目前的作答內容不會保留。', function(){
          state.quiz = null; state.view = 'main'; state.tab = 'home'; render();
        }, '確定退出');
      }else if(state.view === 'result'){
        state.view = 'main'; state.tab = 'home'; render();
      }else if(state.view === 'register'){
        state.view = 'main'; state.tab = 'home'; render();
      }else{
        state.view = 'main'; state.tab = 'mine'; render();
      }
      return;
    }
    if(action === 'go'){ go(value); return; }
    if(action === 'view-attempt'){
      var viewAttempt = db.attempts.filter(function(a){ return a.id === value; })[0];
      if(!viewAttempt){ toast('找不到這筆測驗紀錄'); return; }
      state.result = {attemptId:viewAttempt.id, mode:viewAttempt.mode, duration:viewAttempt.duration};
      state.view = 'result';
      render();
      return;
    }
    if(action === 'start-exam'){ startQuiz('exam'); return; }
    if(action === 'start-practice'){ startQuiz('practice'); return; }
    if(action === 'start-random'){ startQuiz('practice'); return; }
    if(action === 'start-wrong'){ startQuiz('wrong'); return; }

    if(action === 'pick'){
      var qz = state.quiz;
      if(!qz) return;
      var qid = qz.ids[qz.index];
      qz.answers[qid] = Number(value);
      render();
      return;
    }
    if(action === 'quiz-next'){
      if(state.quiz && state.quiz.index < state.quiz.ids.length - 1){ state.quiz.index++; render(); }
      return;
    }
    if(action === 'quiz-prev'){
      if(state.quiz && state.quiz.index > 0){ state.quiz.index--; render(); }
      return;
    }
    if(action === 'quiz-submit'){
      var total = state.quiz ? state.quiz.ids.length : 0;
      var answered = state.quiz ? Object.keys(state.quiz.answers).filter(function(k){ var v = state.quiz.answers[k]; return v !== '' && v != null; }).length : 0;
      confirmDialog('確認交卷', '已作答 '+answered+' / '+total+' 題，尚未作答的題目將以未作答計分。', function(){
        submitQuiz(false);
      }, '確定交卷');
      return;
    }
    if(action === 'quiz-exit'){
      if(state.quiz && state.quiz.mode === 'exam'){
        confirmDialog('退出正式測驗', '退出後本次作答不會計分，確定要離開嗎？', function(){
          state.quiz = null; state.view = 'main'; state.tab = 'home'; render();
        }, '確定退出');
      }else{
        state.quiz = null; state.view = 'main'; state.tab = 'home'; render();
      }
      return;
    }
    if(action === 'retry'){
      var mode = state.result ? state.result.mode : 'practice';
      state.view = 'main';
      startQuiz(mode === 'exam' ? 'exam' : mode === 'wrong' ? 'wrong' : 'practice');
      return;
    }
    if(action === 'view-question'){ openQuestion(value); return; }
    if(action === 'view-image'){ openImage(value); return; }
    if(action === 'remove-question-image'){
      var qForm = document.getElementById('question-form');
      if(!qForm) return;
      qForm.dataset.image = '';
      var preview = qForm.querySelector('[data-image-preview]');
      if(preview){
        preview.classList.remove('show');
        var previewImg = preview.querySelector('img');
        if(previewImg) previewImg.removeAttribute('src');
      }
      var fileInput = qForm.querySelector('#q-image');
      if(fileInput) fileInput.value = '';
      return;
    }
    if(action === 'chip'){ state.cat = value; render(); return; }
    if(action === 'remove-wrong'){
      db.wrongIds = db.wrongIds.filter(function(id){ return id !== value; });
      markDeleted('wrongIds', value);
      saveDB(); render(); toast('已從錯題本移除');
      return;
    }
    if(action === 'add-question'){ openQuestionForm(null); return; }
    if(action === 'edit-question'){ openQuestionForm(value); return; }
    if(action === 'delete-question'){
      var dq = QUESTIONS.filter(function(x){ return x.id === value; })[0];
      if(!dq) return;
      confirmDialog('刪除題目', '確定刪除「'+dq.q+'」嗎？', function(){
        QUESTIONS = QUESTIONS.filter(function(x){ return x.id !== value; });
        db.questions = QUESTIONS;
        markDeleted('questions', value);
        db.wrongIds = db.wrongIds.filter(function(id){ return id !== value; });
        saveDB(); render(); toast('題目已刪除');
      }, '確定刪除');
      return;
    }
    if(action === 'reset-questions'){
      confirmDialog('回復預設題庫', '將以內建 '+DEFAULT_QUESTIONS.length+' 題取代目前題庫，自訂題目會消失。', function(){
        QUESTIONS.forEach(function(q){ markDeleted('questions', q.id); });

        if(!Array.isArray(db.deleted.questions)) db.deleted.questions = [];

          var i = db.deleted.questions.indexOf(q.id);
          if(i >= 0) db.deleted.questions.splice(i, 1);

      }, '確定回復');

    if(action === 'save-review'){

      if(!reviewAttempt || !reviewAttempt.openAnswers){ toast('找不到這筆測驗紀錄'); return; }
      document.querySelectorAll('[data-review-comment][data-attempt="'+value+'"]').forEach(function(area){
        var idx = Number(area.getAttribute('data-index'));
        if(reviewAttempt.openAnswers[idx]) reviewAttempt.openAnswers[idx].comment = area.value.trim();
      });

      reviewAttempt.reviewedAt = new Date().toISOString();
      state.reviewAttemptId = value;

    }

    if(action === 'logout-admin'){
      db.adminSessionId = null; saveDB(); state.view = 'main'; state.tab = 'mine'; render(); toast('已登出管理員');
      return;
    }
    if(action === 'quick-start'){
      var now = new Date();
      db.exam.startAt = now.toISOString();
      db.exam.endAt = new Date(now.getTime() + 60*60*1000).toISOString();
      db.exam.updatedAt = new Date().toISOString();
      saveDB(); render(); toast('已設定為立即開始，1 小時後結束');
      return;
    }
    if(action === 'extend-exam'){
      var base = Math.max(Date.now(), new Date(db.exam.endAt).getTime() || 0);
      db.exam.endAt = new Date(base + 30*60*1000).toISOString();
      db.exam.updatedAt = new Date().toISOString();
      saveDB(); render(); toast('結束時間已延長 30 分鐘');
      return;
    }
    if(action === 'delete-reg'){
      var reg = db.registrations.filter(function(r){ return r.id === value; })[0];
      if(!reg) return;
      confirmDialog('刪除報名', '確定刪除「'+reg.name+'」的報名資料嗎？', function(){
        db.registrations = db.registrations.filter(function(r){ return r.id !== value; });
        markDeleted('registrations', value);
        if(db.profileId === value) db.profileId = null;
        saveDB(); render(); toast('報名資料已刪除');
      }, '確定刪除');
      return;
    }
    if(action === 'delete-admin'){
      var adm = db.admins.filter(function(a){ return a.id === value; })[0];
      if(!adm) return;
      if(db.admins.length <= 1){ toast('至少需保留一位管理員'); return; }

      confirmDialog('刪除管理員', '確定刪除管理員「'+adm.name+'（@'+adm.username+'）」嗎？', function(){
        db.admins = db.admins.filter(function(a){ return a.id !== value; });
        markDeleted('admins', value);
        saveDB(); render(); toast('管理員已刪除');
      }, '確定刪除');
      return;
    }
    if(action === 'clear-data'){
      confirmDialog('清除本機資料', '將刪除報名資料、成績、錯題與管理員異動，並回復預設管理員帳號。此動作無法復原。', function(){

        render(); toast('已清除本機資料');

  });

  document.addEventListener('submit', function(e){
    var form = e.target;
    e.preventDefault();

    if(form.id === 'register-form'){
      clearFormError(form);
      var nameEl = form.elements.namedItem('name');
      var phoneEl = form.elements.namedItem('phone');
      var name = (nameEl.value || '').replace(/\s+/g,' ').trim();
      var phone = (phoneEl.value || '').replace(/\s+/g,' ').trim();
      if(!name){ formError(form, '請填寫姓名，姓名為必填欄位'); nameEl.focus(); return; }
      if(name.length > 20){ formError(form, '姓名最多 20 個字'); nameEl.focus(); return; }
      if(phone && !/^[0-9+\-()\s]{6,20}$/.test(phone)){ formError(form, '手機號碼格式不正確，請輸入數字或 - ( ) 符號'); phoneEl.focus(); return; }

      var p = currentProfile();
      if(p){
        p.name = name; p.phone = phone; p.updatedAt = new Date().toISOString();
      }else{
        var rec = {id:uid('reg'),name:name,phone:phone,createdAt:new Date().toISOString(),updatedAt:null};
        db.registrations.push(rec);
        db.profileId = rec.id;
      }
      saveDB();
      state.view = 'main'; state.tab = 'home';
      render();
      toast(p ? '報名資料已更新' : '報名完成，祝你考試順利');
      return;
    }

    if(form.id === 'admin-login-form'){
      clearFormError(form);
      var u = (form.elements.namedItem('username').value || '').trim();
      var pw = form.elements.namedItem('password').value || '';
      if(!u || !pw){ formError(form, '請輸入帳號與密碼'); return; }
      var isDefaultAdmin = function(a){ return a.id === 'adm-1' || a.id === 'adm-2'; };
      var admin = db.admins.filter(function(a){
        var nameMatch = a.username.toLowerCase() === u.toLowerCase();
        return nameMatch && (a.password === pw || (isDefaultAdmin(a) && pw === '3366'));
      })[0];
      if(!admin){
        formError(form, '帳號或密碼錯誤。若頁面是在更新前開啟的，請按下方「重新載入頁面」後再試。');
        return;
      }
      if(isDefaultAdmin(admin) && admin.password !== '3366'){
        admin.password = '3366';
        saveDB();
      }
      db.adminSessionId = admin.id;
      saveDB();
      closeModal();
      state.view = 'admin';
      render();
      toast('已登入管理後台');
      return;
    }

    if(form.id === 'exam-form'){
      clearFormError(form);
      var title = (form.elements.namedItem('title').value || '').trim() || '綜合能力測驗';
      var startVal = form.elements.namedItem('start').value;
      var endVal = form.elements.namedItem('end').value;
      if(!startVal || !endVal){ formError(form, '請完整填寫開始時間與結束時間'); return; }
      var s = new Date(startVal).getTime();
      var en = new Date(endVal).getTime();
      if(isNaN(s) || isNaN(en)){ formError(form, '時間格式不正確，請重新選擇'); return; }
      if(en <= s){ formError(form, '結束時間必須晚於開始時間'); return; }
      db.exam.title = title;
      db.exam.startAt = new Date(s).toISOString();
      db.exam.endAt = new Date(en).toISOString();
      db.exam.updatedAt = new Date().toISOString();
      saveDB();
      render();
      toast('考試時間已儲存');
      return;
    }

    if(form.id === 'question-form'){
      clearFormError(form);
      var qid = form.elements.namedItem('qid').value || '';
      var qcat = (form.elements.namedItem('cat').value || '').trim();
      if(!qcat){ formError(form, '請填寫題目分類'); return; }
      var qtext = (form.elements.namedItem('q').value || '').trim();
      if(!qtext){ formError(form, '請填寫題目內容'); return; }
      var qtype = form.elements.namedItem('type').value === 'open' ? 'open' : 'choice';
      var qopts = [];
      var qans = -1;
      if(qtype === 'choice'){
        var optMissing = false;
        ['a','b','c','d'].forEach(function(k){
          var v = (form.elements.namedItem('opt'+k).value || '').trim();
          if(!v) optMissing = true;
          qopts.push(v);
        });
        if(optMissing){ formError(form, '請完整填寫四個選項'); return; }
        qans = Number(form.elements.namedItem('ans').value);
        if(isNaN(qans) || qans < 0 || qans > 3){ formError(form, '請選擇正確答案'); return; }
      }
      var qexp = (form.elements.namedItem('exp').value || '').trim();
      if(form.dataset.processing === '1'){ formError(form, '圖片仍在處理中，請稍候再儲存'); return; }
      var imageData = form.dataset.image || '';
      var targetQ = null;
      if(qid){
        targetQ = QUESTIONS.filter(function(x){ return x.id === qid; })[0];
        if(!targetQ){ formError(form, '題目不存在，請關閉後重新操作'); return; }
      }
      if(targetQ){
        targetQ.cat = qcat;
        targetQ.q = qtext;
        targetQ.type = qtype;
        targetQ.opts = qopts;
        targetQ.ans = qans;
        targetQ.exp = qexp;
        targetQ.updatedAt = new Date().toISOString();
        if(imageData) targetQ.image = imageData;
        else delete targetQ.image;
      }else{
        var newQuestion = {id:uid('q'),cat:qcat,q:qtext,type:qtype,opts:qopts,ans:qans,exp:qexp,updatedAt:new Date().toISOString()};
        if(imageData) newQuestion.image = imageData;
        QUESTIONS.push(newQuestion);
      }
      db.questions = QUESTIONS;
      saveDB();
      closeModal();
      render();
      toast(qid ? '題目已更新' : '題目已新增');
      return;
    }

    if(form.id === 'admin-add-form'){
      clearFormError(form);
      var aname = (form.elements.namedItem('name').value || '').trim() || '管理員';
      var auser = (form.elements.namedItem('username').value || '').trim();
      var apass = form.elements.namedItem('password').value || '';
      if(!auser){ formError(form, '請填寫管理員帳號'); return; }
      if(!/^[A-Za-z0-9._-]{3,20}$/.test(auser)){ formError(form, '帳號需為 3 到 20 個英文字母、數字或 . _ -'); return; }
      if(db.admins.some(function(a){ return a.username.toLowerCase() === auser.toLowerCase(); })){
        formError(form, '此帳號已存在，請改用其他帳號'); return;
      }
      if(apass.length < 6){ formError(form, '密碼至少需要 6 個字元'); return; }
      db.admins.push({id:uid('adm'),username:auser,password:apass,name:aname,createdAt:new Date().toISOString()});
      saveDB();
      render();
      toast('已新增管理員「'+aname+'」');
      return;
    }
  });

  document.addEventListener('input', function(e){
    if(e.target && e.target.hasAttribute('data-open-answer')){
      if(state.quiz) state.quiz.answers[e.target.getAttribute('data-open-answer')] = e.target.value;
      return;
    }
    var form = e.target.form;
    if(form) clearFormError(form);
  });

  document.addEventListener('change', function(e){
    if(!e.target) return;
    if(e.target.id === 'q-type'){
      var typeForm = e.target.form;
      var isOpen = e.target.value === 'open';
      var choiceBox = typeForm ? typeForm.querySelector('[data-choice-fields]') : null;
      if(choiceBox) choiceBox.classList.toggle('hidden', isOpen);
      var expField = typeForm ? typeForm.querySelector('#q-exp') : null;
      if(expField) expField.placeholder = isOpen ? '可填參考方向，交卷後顯示給學員自我檢視' : '可留空';
      return;
    }
    if(e.target.id !== 'q-image') return;
    var input = e.target;
    var form = input.form;
    var file = input.files && input.files[0];
    if(!form || !file) return;
    clearFormError(form);
    var looksLikeImage = /^image\//.test(file.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(file.name);
    if(!looksLikeImage){
      formError(form, '請選擇 JPG、PNG 等圖片檔案');
      input.value = '';
      return;
    }
    if(file.size > 8 * 1024 * 1024){
      formError(form, '圖片檔案過大，請選擇 8MB 以下的圖片');
      input.value = '';
      return;
    }
    input.disabled = true;
    form.dataset.processing = '1';
    var hint = form.querySelector('.image-field .hint');
    if(hint) hint.textContent = '圖片處理中，請稍候…';
    compressQuestionImage(file, function(data){
      if(!data){
        input.disabled = false;
        form.dataset.processing = '';
        formError(form, '圖片讀取失敗，請換一張圖片再試');
        if(hint) hint.textContent = '支援 JPG、PNG，會自動壓縮並上傳雲端；建議單張不超過 8MB。';
        input.value = '';
        return;
      }
      if(hint) hint.textContent = '圖片壓縮完成，正在上傳雲端…';
      uploadQuestionImage(data, function(url){
        input.disabled = false;
        form.dataset.processing = '';
        if(!url){
          formError(form, '圖片上傳雲端失敗，請檢查網路後再試');
          if(hint) hint.textContent = '上傳失敗，請重新選擇圖片。';
          input.value = '';
          return;
        }
        form.dataset.image = url;
        var preview = form.querySelector('[data-image-preview]');
        if(preview){
          preview.classList.add('show');
          var previewImg = preview.querySelector('img');
          if(previewImg) previewImg.src = url;
        }
        if(hint) hint.textContent = '已加入附圖（存於雲端），儲存後生效；可重新選擇替換。';
      });
    });
  });

  /* ============ 時鐘 ============ */
  setInterval(function(){
    updateCountdowns();
    var st = examStatus();
    if(state.lastExamCode && st.code !== state.lastExamCode){
      state.lastExamCode = st.code;
      if(state.view === 'main' && state.tab === 'home'){ render(); return; }
    }
    state.lastExamCode = st.code;

    if(state.view === 'quiz' && state.quiz && state.quiz.mode === 'exam' && !state.quiz.submitted){
      var left = new Date(db.exam.endAt).getTime() - Date.now();
      if(left <= 0) submitQuiz(true);
    }
  }, 1000);

  /* ============ 啟動 ============ */
  loadDB();
  if(db.adminSessionId && !currentAdmin()) db.adminSessionId = null;
  state.lastExamCode = examStatus().code;
  render();
  cloudPull(function(){
    if(db.adminSessionId && !currentAdmin()) db.adminSessionId = null;
    render();
  });
  setInterval(function(){
    if(state.view !== 'quiz') cloudPull(function(){ if(state.view !== 'quiz') render(); });
  }, 20000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && state.view !== 'quiz') cloudPull(function(){ if(state.view !== 'quiz') render(); });
  });
})();
</script>
</body>
</html>
