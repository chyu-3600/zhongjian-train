<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d2ff2">
<title>忠鍵訓練</title>
<style>
:root{
  --grad-header:linear-gradient(120deg,#6d2ff2,#3f6df5);
  --purple:#6d2ff2; --purple-d:#5323c4; --bg:#f5f6fa; --card:#ffffff;
  --txt:#242435; --muted:#8b8fa8; --line:#eceef6; --red:#e5484d; --green:#1aad62;
  --shadow:0 6px 22px rgba(70,50,160,.08); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
.hidden{display:none!important}

/* ── 登入牆 ── */
#viewLogin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--grad-header);padding:24px}
.login-card{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:28px 22px 24px;box-shadow:var(--shadow);text-align:center}
.login-logo{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid #f0ecff}
.login-card h1{font-size:21px;letter-spacing:1px}
.login-tip{color:var(--muted);font-size:13px;margin:6px 0 18px}
.login-card input{text-align:center;letter-spacing:6px;font-size:20px;margin-bottom:12px}
.login-btn{width:100%;padding:13px;border-radius:12px;background:var(--grad-header);color:#fff;font-size:16px;font-weight:700}
.login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

/* ── 頂部 ── */
.hero{background:var(--grad-header);border-radius:0 0 22px 22px;padding:16px 16px 18px;color:#fff;box-shadow:var(--shadow)}
.hero-row{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:#fff;overflow:hidden;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero-name{font-size:20px;font-weight:700;letter-spacing:.5px}
.hero-role{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:600}
.hero-right{margin-left:auto;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px}
.hero-sub{margin-top:10px;font-size:13px;opacity:.85}

.wrap{padding:16px 16px calc(76px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sec-title{font-size:16px;font-weight:700;margin:18px 0 10px;padding-left:10px;border-left:4px solid var(--purple)}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.searchbar .s-ico{font-size:16px;color:var(--muted)}
.searchbar input{border:none;padding:0;flex:1;background:transparent;font-size:15px}
.searchbar .s-clear{font-size:13px;color:var(--muted);padding:2px 8px;border-radius:999px;background:var(--bg)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 12px 12px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--txt);transition:transform .12s}
.cat:active{transform:scale(.92)}
.cat .ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.cat .ico img{width:38px;height:38px;object-fit:contain;pointer-events:none}
.g-red{background:linear-gradient(145deg,#ff8a7a,#ff4d6d)}
.g-cyan{background:linear-gradient(145deg,#67d8ff,#3a7bd5)}
.g-orange{background:linear-gradient(145deg,#ffc46b,#ff8a5c)}
.g-pink{background:linear-gradient(145deg,#e2a6ff,#b06ab3)}
.g-teal{background:linear-gradient(145deg,#63ecd0,#22b8a0)}
.g-amber{background:linear-gradient(145deg,#ffcf8a,#ff7847)}
.g-green{background:linear-gradient(145deg,#88f0b8,#2fbf71)}
.g-blue{background:linear-gradient(145deg,#7ec9ff,#3f6df5)}
.cat.on .ico{outline:3px solid rgba(109,47,242,.35);outline-offset:2px}
.cat.on{color:var(--purple)}
.calc-frame{display:block;width:100%;height:520px;border:0;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.nb-frame{display:block;width:100%;height:calc(100vh - 220px);min-height:520px;border:0;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}

/* ── 課程卡 ── */
.course{position:relative;display:flex;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 46px 14px 14px;box-shadow:var(--shadow);margin-bottom:12px;align-items:center}
.fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#c3c7d8;background:rgba(255,255,255,.9)}
.fav.on{color:#f5a623}
.course-thumb{flex:0 0 64px;width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#e8e3ff,#d9e6ff);display:grid;place-items:center;font-size:30px;overflow:hidden}
.course-body{flex:1;min-width:0}
.course-title{font-size:15px;font-weight:700}
.course-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.course-desc{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:5px;margin-right:6px}
.badge.yt{background:#ffe9e9;color:#d33}
.badge.pdf{background:#e8f6ef;color:#1a8f55}
.empty-tip{text-align:center;color:var(--muted);font-size:14px;padding:36px 0}

/* ── 首頁：統計卡 ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.stat .n{font-size:24px;font-weight:800;color:var(--purple-d);line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.quick{display:flex;gap:10px;margin-top:14px}
.quick button{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--txt)}
.quick .qi{font-size:24px}
.recent{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 14px}
.recent-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.recent-item:first-child{border-top:0}
.recent-item .rt{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .rd{color:var(--muted);font-size:12px;flex:0 0 auto}

/* ── 記錄表 ── */
.table-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f3efff;color:var(--purple-d);font-weight:700;text-align:left;padding:10px 8px;white-space:nowrap}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.pass-y{color:var(--green);font-weight:700}
.pass-n{color:var(--red);font-weight:700}
.btn-line{display:flex;gap:10px;margin:12px 0}
.btn{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:700;text-align:center}
.btn-primary{background:var(--grad-header);color:#fff}
.btn-ghost{background:#fff;color:var(--purple);border:1px solid var(--purple)}
.btn-gray{background:#eef0f6;color:var(--txt)}
.row-ops{display:flex;gap:8px}
.mini{padding:5px 10px;border-radius:8px;font-size:12px;background:#f3efff;color:var(--purple-d);font-weight:600}
.mini.del{background:#ffe9e9;color:var(--red)}

/* ── 管理 ── */
.manage-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.manage-item .t{flex:1;font-size:14px;font-weight:600}
.manage-item .c{font-size:12px;color:var(--muted)}

/* ── 彈窗 ── */
#modalWrap{position:fixed;inset:0;background:rgba(20,16,50,.55);display:grid;place-items:center;z-index:60;padding:18px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal h3{font-size:17px;margin-bottom:12px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.video-box{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pdf-link{display:block;background:#e8f6ef;color:#1a8f55;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:10px}
.file-hint{font-size:12px;color:var(--muted);margin-top:5px}

/* ── 底部導覽 ── */
#tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
#tabbar button.on{color:var(--purple);font-weight:700}
#tabbar .ico{font-size:20px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,25,60,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;max-width:86vw;text-align:center}
.offline-bar{background:#fff6e0;color:#8a6100;font-size:13px;text-align:center;padding:8px 12px}
</style>
</head>

function loadScript(src) {
  loadScript._c = loadScript._c || {};

    const s = document.createElement('script');

    document.head.appendChild(s);

}

/* ══════════════════ 2. Supabase REST ══════════════════ */
const SB_OK = { 'Content-Type': 'application/json', apikey: CONFIG.supabaseAnonKey, Authorization: 'Bearer ' + CONFIG.supabaseAnonKey };
async function sbGet(table) {
  const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${table}?select=*&order=id.asc`, { headers: SB_OK });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function sbInsert(table, row) {
  const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${table}?select=*`, {
    method: 'POST', headers: { ...SB_OK, Prefer: 'return=representation' }, body: JSON.stringify(row),
  });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(); return j[0];
}
async function sbUpdate(table, id, patch) {
  const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH', headers: { ...SB_OK, Prefer: 'return=representation' }, body: JSON.stringify(patch),
  });
  if (!r.ok) throw new Error(r.status);
}
async function sbDelete(table, id) {
  const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers: SB_OK });
  if (!r.ok) throw new Error(r.status);
}
async function uploadPdf(file) {
  const ext = (file.name.match(/\.(\w+)$/) || [, 'pdf'])[1];
  const path = 'courses/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  const r = await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/media/${path}`, {
    method: 'POST',
    headers: { apikey: CONFIG.supabaseAnonKey, Authorization: 'Bearer ' + CONFIG.supabaseAnonKey, 'Content-Type': file.type || 'application/pdf', 'x-upsert': 'true' },
    body: file,
  });
  if (!r.ok) throw new Error('上傳失敗 ' + r.status);
  return `${CONFIG.supabaseUrl}/storage/v1/object/public/media/${path}`;
}

}
function logout() {
  localStorage.removeItem(LS.sess);

  $('loginPass').value = '';

async function saveCourse(id) {

  const file = $('fFile').files[0];
  $('fSave').disabled = true; $('fSave').textContent = '儲存中…';
  try {
    if (file) row.file_url = await uploadPdf(file);
    else if (id) row.file_url = (courses.find(x => x.id == id) || {}).file_url || '';
    if (id) {
      await sbUpdate('courses', id, row);
      Object.assign(courses.find(x => x.id == id), row);
    } else {
      const r = await sbInsert('courses', row); if (r) courses.push(r);
    }
    closeModal(); renderAll(); toast(id ? '課程已更新' : '課程已新增');
  } catch (e) { toast('儲存失敗：' + e.message); $('fSave').disabled = false; $('fSave').textContent = '儲存'; }

/* ══════════════════ 7. 匯出 Excel / Word ══════════════════ */
function exportRows() {
  const head = ['員工', '課程', '日期', '時數', '考核'];
  const body = [...records].sort((a, b) => String(a.date).localeCompare(String(b.date)))
    .map(r => [r.employee, courseName(r.course_id), fmtDate(r.date), r.hours, isPass(r) ? '合格' : '未合格']);
  return { head, body };
}
async function exportExcel() {
  if (!records.length) return toast('沒有記錄可匯出');
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const { head, body } = exportRows();
    const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
    ws['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 12 }, { wch: 8 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '訓練記錄');
    XLSX.writeFile(wb, `忠鍵訓練記錄_${new Date().toISOString().slice(0, 10)}.xlsx`);
    toast('Excel 已匯出');
  } catch { toast('匯出元件載入失敗，請確認網路後再試'); }
}
async function exportWord() {
  if (!records.length) return toast('沒有記錄可匯出');
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
    const { head, body } = exportRows();
    const row = cells => new docx.TableRow({ children: cells.map(t => new docx.TableCell({
      children: [new docx.Paragraph({ children: [new docx.TextRun({ text: String(t), bold: cells === head, size: 20 })], alignment: docx.AlignmentType.CENTER })],
    })) });
    const table = new docx.Table({ width: { size: 100, type: docx.WidthType.PERCENTAGE }, rows: [row(head), ...body.map(row)] });
    const doc = new docx.Document({ sections: [{ children: [
      new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [new docx.TextRun({ text: '忠鍵工業 · 教育訓練記錄', bold: true, size: 32 })] }),
      new docx.Paragraph({ text: `匯出日期：${new Date().toISOString().slice(0, 10)}　共 ${body.length} 筆`, alignment: docx.AlignmentType.CENTER }),
      new docx.Paragraph(''), table,
    ] }] });
    const blob = await docx.Packer.toBlob(doc);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `忠鍵訓練記錄_${new Date().toISOString().slice(0, 10)}.docx`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('Word 已匯出');
  } catch { toast('匯出元件載入失敗，請確認網路後再試'); }
}

function makeIcon(size) {
  return new Promise(resolve => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const img = new Image();
    img.onload = () => { c.getContext('2d').drawImage(img, 0, 0, size, size); resolve(c.toDataURL('image/png')); };
    img.onerror = () => resolve(null);
    img.src = LOGO_URI;
  });
}
(async () => {
  try {
    const srcs = await Promise.all([192, 512].map(s => makeIcon(s)));
    const icons = srcs.filter(Boolean).map((src, i) => ({ src, sizes: `${[192, 512][i]}x${[192, 512][i]}`, type: 'image/png', purpose: 'any' }));
    const manifest = {
      name: CONFIG.appName, short_name: CONFIG.shortName,
      start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#f5f6fa', theme_color: '#6d2ff2', icons,
    };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = LOGO_URI; document.head.appendChild(fav);
    const al = document.createElement('link'); al.rel = 'apple-touch-icon'; al.href = icons.length ? icons[0].src : LOGO_URI; document.head.appendChild(al);
  } catch (e) { console.warn('manifest 生成失敗', e); }
})();

/* ══════════════════ 10. 啟動 ══════════════════ */
async function boot() {
  if (!session) session = { role: localStorage.getItem(LS.sess) || '' };
  if (!session.role || !['admin', 'staff'].includes(session.role)) { $('viewLogin').classList.remove('hidden'); return; }
  $('viewLogin').classList.add('hidden');
  $('tabbar').classList.remove('hidden');
  go('viewHome', document.querySelector('#tabbar button'));
  await refreshData();
  if (lastReadOk && courses.length === 0) await seedDemo();
  renderAll();
}
boot();
