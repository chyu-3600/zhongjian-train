<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金屬重量計算器 · 空心件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f6fb;--card:#fff;--txt:#16181d;--sub:#5b6472;--line:#e3e7ef;
  --acc:#4f46e5;--acc2:#7c3aed;--soft:#eef0ff;--metal:#b9c2d6;--ok:#0f766e;--warn:#b45309;
  --shadow:0 6px 20px rgba(20,24,40,.07);--radius:16px;
}
[data-theme="dark"]{
  --bg:#12141a;--card:#1c1f28;--txt:#eef1f6;--sub:#98a2b3;--line:#2b303c;
  --acc:#8b8bf5;--acc2:#a78bfa;--soft:#242739;--metal:#4b5468;--ok:#2dd4bf;--warn:#fbbf24;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.55;padding:14px 14px 40px}
.wrap{max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-size:21px;color:#fff;box-shadow:var(--shadow)}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11.5px;color:var(--sub)}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.lab{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:1.2px;margin-bottom:11px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:13px;padding:11px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s}
.seg button .g{font-size:22px;line-height:1}
.seg button.on{border-color:var(--acc);background:var(--soft);color:var(--acc);box-shadow:0 4px 12px rgba(79,70,229,.16)}
.hint{font-size:11.5px;color:var(--sub);margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s}
.chips button.on{border-color:var(--acc);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.rho{font-size:12px;color:var(--sub);margin-top:10px}
.rho b{color:var(--acc);font-size:13.5px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:5px}
.f span{font-size:11.5px;font-weight:700;color:var(--sub)}
.f i{font-style:normal;color:var(--acc);font-size:10.5px}
.f input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;
  font-size:16px;font-weight:700;color:var(--txt);outline:none;transition:.15s;-moz-appearance:textfield}
.f input:focus{border-color:var(--acc);background:var(--card)}
.f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.out{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:2px}
.out .v{font-size:38px;font-weight:900;letter-spacing:-1px;color:var(--acc);font-variant-numeric:tabular-nums}
.out .u{font-size:15px;font-weight:800;color:var(--sub)}
.sub-out{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 14px;font-size:11.5px;color:var(--sub);margin-top:4px}
.sub-out b{color:var(--txt);font-variant-numeric:tabular-nums}
.err{display:none;margin-top:10px;padding:9px 11px;border-radius:11px;background:#fef2f2;color:#b91c1c;font-size:12.5px;font-weight:700}
[data-theme="dark"] .err{background:#3a1d1d;color:#fca5a5}
.err.on{display:block}
.note{display:none;margin-top:8px;font-size:11.5px;color:var(--warn);font-weight:700}
.note.on{display:block}
.formula{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub);
  text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.pv svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--bg)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--sub)}
.legend div{display:flex;align-items:center;gap:6px}
.legend em{width:11px;height:11px;border-radius:3px;display:inline-block}
.btnline{display:flex;gap:9px}
.btnline button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:12px;
  padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.btnline button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:var(--shadow)}
.foot{text-align:center;font-size:10.5px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <div class="brand">
      <div class="lg">⚖️</div>
      <div><h1>金屬重量計算器</h1><p>空心件 · 圓孔／六角孔／四角孔</p></div>
    </div>
    <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 夜間</button>
  </header>

  <section class="card">
    <div class="lab">① 內孔外形</div>
    <div class="seg" id="shapes">
      <button class="on" data-s="round" onclick="setShape('round')"><span class="g">⭕</span>圓孔空心</button>
      <button data-s="hex" onclick="setShape('hex')"><span class="g">⬡</span>六角孔空心</button>
      <button data-s="square" onclick="setShape('square')"><span class="g">▧</span>四角孔空心</button>
    </div>
    <div class="hint" id="shapeHint"></div>
  </section>

  <section class="card">
    <div class="lab">② 材質</div>
    <div class="chips" id="mats"></div>
    <div class="rho">密度 ρ = <b id="rhoVal">7.85</b> g/cm³ <span id="rhoName">（一般碳鋼）</span></div>
  </section>

  <section class="card">
    <div class="lab">③ 尺寸 · 單位毫米（mm）</div>
    <div class="fields" id="fields"></div>
    <div class="err" id="err"></div>
    <div class="note" id="note"></div>
  </section>

  <section class="card">
    <div class="lab">重量結果</div>
    <div class="out"><span class="v" id="grams">0.000</span><span class="u">g</span></div>
    <div class="sub-out">
      <span>= <b id="kg">0.0000</b> kg</span>
      <span>體積 <b id="vol">0.000</b> mm³</span>
      <span>淨截面積 <b id="area">0.000</b> mm²</span>
    </div>
    <div class="formula" id="formula"></div>
  </section>

  <section class="card">
    <div class="lab">剖面／側視預覽（隨輸入比例變動）</div>
    <div class="pv">
      <svg id="secSvg" viewBox="0 0 200 200" role="img" aria-label="剖面圖"></svg>
      <svg id="sideSvg" viewBox="0 0 200 200" role="img" aria-label="側視圖"></svg>
    </div>
    <div class="legend" style="margin-top:10px">
      <div><em style="background:var(--metal)"></em>材質實體</div>
      <div><em style="background:var(--card);border:1px solid var(--line)"></em>空心（孔）部</div>
    </div>
  </section>

  <div class="btnline">
    <button onclick="resetAll()">↺ 清空重設</button>
    <button class="p" onclick="calc()">＝ 重新計算</button>
  </div>
  <div class="foot">公式：重量(g) = 淨截面積(mm²) × 長(mm) × ρ ÷ 1000</div>

</div>

<script>
const MATS = [
  { name:'一般碳鋼', rho:7.85 },
  { name:'鎢鋼',     rho:14.50 },
  { name:'鋁',       rho:2.70 },
  { name:'銅',       rho:8.90 },
  { name:'鈦合金',   rho:4.51 }
];
const SHAPES = {
  round:  { label:'圓孔空心',  hint:'外圓＋圓孔：填外徑 D、孔徑 d、長度 L。', fields:[['D','外徑'],['d','孔徑'],['L','長度']] },
  hex:    { label:'六角孔空心', hint:'外圓＋正六角孔：六角的對邊（平行面距離）為主控尺寸，對角可留空由系統推算。', fields:[['D','外徑'],['S','對邊'],['Ac','對角'],['L','長度']] },
  square: { label:'四角孔空心', hint:'外圓＋正方形孔：對邊＝邊長，對角＝邊長×√2，對角可留空由系統推算。', fields:[['D','外徑'],['S','對邊'],['Ac','對角'],['L','長度']] }
};
const HEX_K = 1.1547005383792515;   // 對角 / 對邊
const SQ_K  = 1.4142135623730951;   // 對角 / 對邊

let shape = 'round', mat = 0;
const $ = id => document.getElementById(id);
const num = id => { const v = parseFloat($(id)?.value); return Number.isFinite(v) && v > 0 ? v : null; };

function renderMats() {
  $('mats').innerHTML = MATS.map((m, i) =>
    `<button class="${i === mat ? 'on' : ''}" onclick="setMat(${i})">${m.name}</button>`).join('');
}
function renderFields() {
  const f = SHAPES[shape].fields;
  $('fields').innerHTML = f.map(([k, t]) =>
    `<label class="f"><span>${t}</span>
      <input id="in-${k}" type="number" inputmode="decimal" step="0.001" min="0" placeholder="0" oninput="calc()"></label>`).join('');
  $('shapeHint').textContent = SHAPES[shape].hint;
}
function setShape(s) {
  const keep = {};
  ['D', 'd', 'S', 'Ac', 'L'].forEach(k => { const e = $('in-' + k); if (e) keep[k] = e.value; });
  shape = s;
  [...$('shapes').children].forEach(b => b.classList.toggle('on', b.dataset.s === s));
  renderFields();
  ['D', 'd', 'S', 'Ac', 'L'].forEach(k => { if (keep[k] && $('in-' + k)) $('in-' + k).value = keep[k]; });
  calc();
}
function setMat(i) { mat = i; renderMats(); updateRho(); calc(); }
function updateRho() {
  $('rhoVal').textContent = MATS[mat].rho.toFixed(2);
  $('rhoName').textContent = `（${MATS[mat].name}）`;
}

/* 回傳 { area, err, note, formula }：孔的截面積與淨面積 */
function boreArea() {
  const D = num('in-D'), L = num('in-L');
  if (!D) return { err: '請輸入外徑 D' };
  if (!L) return { err: '請輸入長度 L' };
  const outer = Math.PI / 4 * D * D;
  const note = [];

  if (shape === 'round') {
    const d = num('in-d');
    if (!d) return { err: '請輸入孔徑 d' };
    if (d >= D) return { err: '孔徑 d 必須小於外徑 D' };
    return {
      net: outer - Math.PI / 4 * d * d, D, L, bore: { t: 'circle', d },
      formula: `W = π/4 × (D² − d²) × L × ρ / 1000 = π/4 × (${D}² − ${d}²) × ${L} × ${MATS[mat].rho} / 1000`
    };
  }

  const k = shape === 'hex' ? HEX_K : SQ_K;
  let S = num('in-S'), Ac = num('in-Ac');
  if (!S && !Ac) return { err: shape === 'hex' ? '請輸入六角的對邊或對角' : '請輸入方孔的對邊或對角' };
  if (!S) { S = Ac / k; note.push(`未填對邊，由對角推算：對邊 = ${(S).toFixed(3)} mm`); }
  else if (Ac) {
    const ideal = S * k;
    if (Math.abs(Ac - ideal) / ideal > 0.01)
      note.push(`對邊 ${S} 的理論對角是 ${ideal.toFixed(3)}，與輸入的 ${Ac} 差 ${(100 * (Ac - ideal) / ideal).toFixed(1)}%，本計算以「對邊」為準。`);
  }
  const diagMax = S * k;
  if (diagMax >= D) return { err: '內孔尺寸大於外徑，無法形成空心件' };
  const area = shape === 'hex' ? Math.sqrt(3) / 2 * S * S : S * S;
  const expr = shape === 'hex' ? `√3/2 × ${S}²` : `${S}²`;
  return {
    net: outer - area, D, L, bore: { t: shape, S }, note,
    formula: `W = (π/4 × ${D}² − ${expr}) × ${L} × ${MATS[mat].rho} / 1000`
  };
}

function calc() {
  const r = boreArea();
  const err = $('err'), note = $('note');
  if (r.err) {
    err.textContent = '⚠️ ' + r.err; err.classList.add('on');
    $('grams').textContent = '0.000'; $('kg').textContent = '0.0000';
    $('vol').textContent = '0.000'; $('area').textContent = '0.000';
    $('formula').textContent = ''; draw(r.D || 20, r.bore, r.L || 40);
    note.classList.remove('on');
    return;
  }
  err.classList.remove('on');
  const rho = MATS[mat].rho;
  const vol = r.net * r.L;
  const g = vol * rho / 1000;
  $('grams').textContent = g.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  $('kg').textContent = (g / 1000).toFixed(4);
  $('vol').textContent = vol.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  $('area').textContent = r.net.toFixed(3);
  $('formula').textContent = r.formula + ` = ${g.toFixed(3)} g`;
  if (r.note?.length) { note.textContent = 'ℹ️ ' + r.note.join('　'); note.classList.add('on'); }
  else note.classList.remove('on');
  draw(r.D, r.bore, r.L);
}

function draw(D, bore, L) {
  const cs = 82 / (D / 2);                       // 外徑半徑 → 82px
  const cx = 100, cy = 100;
  let hole = '';
  if (!bore) hole = '';
  else if (bore.t === 'circle') {
    hole = `<circle cx="${cx}" cy="${cy}" r="${(bore.d / 2 * cs).toFixed(2)}" class="hb"/>`;
  } else {
    const R = bore.S * (bore.t === 'hex' ? HEX_K : SQ_K) / 2 * cs;   // 外接圓半徑 → px
    hole = bore.t === 'square'
      ? `<rect x="${cx - bore.S * cs / 2}" y="${cy - bore.S * cs / 2}" width="${bore.S * cs}" height="${bore.S * cs}" class="hb"/>`
      : `<polygon points="${[0, 1, 2, 3, 4, 5].map(i => {
          const a = Math.PI / 3 * i - Math.PI / 2;
          return `${(cx + R * Math.cos(a)).toFixed(2)},${(cy + R * Math.sin(a)).toFixed(2)}`;
        }).join(' ')}" class="hb"/>`;
  }
  const boreLabel = !bore ? '' : bore.t === 'circle'
    ? `Ø孔 ${(+bore.d.toFixed(3))}`
    : `${bore.t === 'hex' ? '六角對邊' : '四角對邊'} ${(+bore.S.toFixed(3))}`;
  $('secSvg').innerHTML = `
    <style>
      .ob{fill:var(--metal);stroke:var(--acc);stroke-width:2}
      .hb{fill:var(--card);stroke:var(--acc2);stroke-width:1.6;stroke-dasharray:4 3}
      .dm{stroke:var(--sub);stroke-width:1;fill:none}
      .tx{fill:var(--sub);font-size:11px;font-weight:700;text-anchor:middle}
    </style>
    <circle cx="${cx}" cy="${cy}" r="${(D / 2 * cs).toFixed(2)}" class="ob"/>
    ${hole}
    <line x1="${cx - D / 2 * cs}" y1="${cy}" x2="${cx + D / 2 * cs}" y2="${cy}" class="dm"/>
    <text x="${cx}" y="22" class="tx">Ø ${(+D.toFixed(3))}</text>
    <text x="${cx}" y="194" class="tx">${boreLabel}</text>`;

  const w = Math.min(150, 60 + (L / D) * 55);
  const x = (200 - w) / 2, h = 92, y = 54;
  let sideHole = '';
  if (bore) {
    const inner = bore.t === 'circle' ? bore.d : bore.S;
    const hh = inner * cs / 2;
    sideHole = `<line x1="${x + 3}" y1="${100 - hh}" x2="${x + w - 3}" y2="${100 - hh}" class="hb2"/>
      <line x1="${x + 3}" y1="${100 + hh}" x2="${x + w - 3}" y2="${100 + hh}" class="hb2"/>`;
  }
  $('sideSvg').innerHTML = `
    <style>
      .sb{fill:var(--metal);stroke:var(--acc);stroke-width:2;opacity:.92}
      .hb2{stroke:var(--acc2);stroke-width:1.6;stroke-dasharray:4 3}
    </style>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="sb"/>
    ${sideHole}
    <line x1="${x}" y1="160" x2="${x + w}" y2="160" class="dm"/>
    <text x="100" y="176" class="tx">長 L = ${(+L.toFixed(3))} mm</text>
    <text x="100" y="40" class="tx">Ø ${(+D.toFixed(3))} mm</text>`;
}

function resetAll() {
  ['D', 'd', 'S', 'Ac', 'L'].forEach(k => { const e = $('in-' + k); if (e) e.value = ''; });
  calc();
}

function toggleTheme() {
  const d = document.documentElement;
  const next = d.dataset.theme === 'dark' ? 'light' : 'dark';
  d.dataset.theme = next;
  $('themeBtn').textContent = next === 'dark' ? '☀️ 日間' : '🌙 夜間';
  try { localStorage.setItem('calc_hollow_theme', next); } catch (e) {}
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem('calc_hollow_theme'); } catch (e) {}
  if (!t) t = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  $('themeBtn').textContent = t === 'dark' ? '☀️ 日間' : '🌙 夜間';
})();

renderMats();
renderFields();
updateRho();
calc();
</script>
</body>
</html>
</script>
</body>
</html>
