<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 圓相切計算器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f3f9;
  --bg-grad:radial-gradient(1100px 700px at 88% -12%,#dbeafe 0%,transparent 58%),radial-gradient(950px 650px at -12% 28%,#e0e7ff 0%,transparent 55%),radial-gradient(900px 620px at 55% 115%,#ffe4e6 0%,transparent 55%),linear-gradient(165deg,#f6f7fc,#edf0f8);
  --card:rgba(255,255,255,.82);--text:#1d1d1f;--text2:#55555e;--text3:#98989f;
  --border:#e3e3ee;--border2:#ededf4;--accent:#0071e3;--accent-hover:#0077ed;
  --accent-light:#e8f0fe;--shadow:0 10px 30px rgba(96,102,177,.13);
  --sv-bg:rgba(248,249,252,.94);--sv-stroke:#333;--sv-dim:#0071e3;--sv-text:#333;
  --sv-circle:#ff6b35;--sv-line:#2563eb;--sv-ext:#e5e5ea;
  --tag-bg:#fffbeb;--input-bg:#fafbff;
  --result-bg:linear-gradient(130deg,#6d28d9 0%,#db2777 55%,#f97316 115%);
  --in-grad:linear-gradient(90deg,#0071e3,#06b6d4);
  --pv-grad:linear-gradient(90deg,#7c3aed,#ec4899);
  --fm-grad:linear-gradient(90deg,#f59e0b,#f43f5e);
  --glow:0 6px 16px rgba(0,113,227,.28);
}
body.dark{
  --bg:#131318;
  --bg-grad:radial-gradient(1100px 700px at 88% -12%,#1d2c52 0%,transparent 58%),radial-gradient(950px 650px at -12% 28%,#291d4d 0%,transparent 55%),radial-gradient(900px 620px at 55% 115%,#421f36 0%,transparent 55%),linear-gradient(165deg,#15151c,#101016);
  --card:rgba(41,41,49,.86);--text:#f5f5f7;--text2:#c0c0c8;--text3:#7a7a82;
  --border:#3e3e48;--border2:#4a4a54;--accent:#0a84ff;--accent-hover:#409cff;
  --accent-light:#17304e;--shadow:0 12px 34px rgba(0,0,0,.5);
  --sv-bg:rgba(38,38,46,.92);--sv-stroke:#aaa;--sv-dim:#0a84ff;--sv-text:#ccc;
  --sv-circle:#ff9f0a;--sv-line:#5e9eff;--sv-ext:#3a3a3c;
  --tag-bg:rgba(64,48,26,.4);--input-bg:#33333c;
  --result-bg:linear-gradient(130deg,#5b21b6 0%,#be185d 55%,#c2410c 115%);
  --in-grad:linear-gradient(90deg,#0a84ff,#22d3ee);
  --pv-grad:linear-gradient(90deg,#8b5cf6,#f472b6);
  --fm-grad:linear-gradient(90deg,#fbbf24,#fb7185);
  --glow:0 6px 16px rgba(10,132,255,.4);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg-grad);background-attachment:fixed;background-color:var(--bg);color:var(--text);min-height:100vh;transition:background-color .35s,color .35s;display:flex;justify-content:center;padding:36px 20px;line-height:1.6}
.container{max-width:760px;width:100%}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.header h1{font-size:27px;font-weight:800;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#0a84ff,#8b5cf6 50%,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header h1 small{font-size:14px;font-weight:500;color:var(--text3);background:none;-webkit-text-fill-color:currentColor}
.theme-btn{width:44px;height:44px;border-radius:14px;border:none;background:linear-gradient(135deg,#0a84ff,#8b5cf6);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.theme-btn:hover{transform:rotate(15deg) scale(1.08);box-shadow:0 8px 22px rgba(139,92,246,.55)}
.card{position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:34px 38px;margin-bottom:26px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .3s,box-shadow .3s,border-color .35s,background .35s}
.card:hover{transform:translateY(-3px)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;z-index:1}
.card-input::before{background:var(--in-grad)}
.card-preview::before{background:var(--pv-grad)}
.card-formula::before{background:var(--fm-grad)}
.card-input:hover{box-shadow:0 14px 34px rgba(0,113,227,.18)}
.card-preview:hover{box-shadow:0 14px 34px rgba(139,92,246,.2)}
.card-formula:hover{box-shadow:0 14px 34px rgba(245,158,11,.2)}
label{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--text2);margin-bottom:14px;letter-spacing:.3px}
label::before{content:'';width:9px;height:9px;border-radius:3px;transform:rotate(45deg);flex:none}
.card-input label::before{background:var(--in-grad)}
.card-preview label::before{background:var(--pv-grad)}
label .hint{font-weight:400;font-size:13px;color:var(--text3);margin-left:auto;padding-left:6px}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-bottom:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border2);outline:none;margin-top:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#06b6d4);cursor:pointer;border:2.5px solid #fff;box-shadow:var(--glow);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.input-group input[type=number]{width:100%;padding:15px 18px;border:1.5px solid var(--border2);border-radius:14px;background:var(--input-bg);color:var(--text);font-size:19px;font-weight:600;outline:none;transition:border-color .2s,box-shadow .2s}
.input-group input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.14)}
.slider-row{display:flex;align-items:center;gap:16px;margin-top:14px}
.slider-row input[type=range]{flex:1}
.slider-val{min-width:68px;text-align:center;padding:5px 12px;border-radius:10px;background:var(--accent-light);font-size:16px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

/* SVG Preview */
.sv-wrap{background:var(--sv-bg);border-radius:18px;padding:34px;text-align:center;min-height:320px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--border);transition:all .35s}
.sv-wrap svg{max-width:100%;height:auto;filter:drop-shadow(0 6px 18px rgba(80,90,170,.12))}
.sv-foot{display:flex;justify-content:space-between;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--text3);gap:16px}
.sv-foot span{padding:6px 14px;border-radius:999px;background:rgba(125,125,160,.09)}

/* Result */
@keyframes floatY{from{transform:translateY(0)}to{transform:translateY(18px)}}
.result-area{background:var(--result-bg);border-radius:22px;padding:38px 40px;text-align:center;position:relative;overflow:hidden;margin-bottom:26px;box-shadow:0 16px 38px rgba(147,51,134,.35)}
.result-area::before{content:'';position:absolute;top:-45%;right:-15%;width:220px;height:220px;background:rgba(255,255,255,.09);border-radius:50%;animation:floatY 5s ease-in-out infinite alternate}
.result-area::after{content:'';position:absolute;bottom:-55%;left:-12%;width:240px;height:240px;background:rgba(255,255,255,.07);border-radius:50%;animation:floatY 6s ease-in-out infinite alternate-reverse}
.result-area .rlabel{display:inline-block;color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.8px;position:relative;z-index:1;margin-bottom:12px;padding:7px 18px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
.result-area .rval{color:#fff;font-size:50px;font-weight:800;margin:8px 0;line-height:1.25;text-shadow:0 4px 20px rgba(0,0,0,.22);position:relative;z-index:1}
.result-area .rval .dec{font-size:24px;font-weight:500}
.result-area .runit{display:inline-block;color:#fff;font-size:14px;font-weight:600;position:relative;z-index:1;padding:4px 16px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:2px}
.result-area .rdetail{color:rgba(255,255,255,.65);font-size:13px;margin-top:16px;line-height:1.7;position:relative;z-index:1}

/* Formula card */
.formula-box{position:relative;padding:22px 30px;background:var(--tag-bg);border:1px solid rgba(245,158,11,.28);border-radius:14px;font-size:16px;color:var(--text2);text-align:center;font-family:'SF Mono',Menlo,monospace;transition:all .35s;line-height:2;overflow:hidden}
.formula-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--fm-grad)}
.formula-box strong{background:var(--fm-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

@media(max-width:560px){body{padding:20px 14px}.card{padding:28px 22px}.input-row{grid-template-columns:1fr;gap:24px}.result-area{padding:32px 22px}.result-area .rval{font-size:38px}.sv-wrap{padding:18px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📐 圓相切 <small>頂點 → 圓心距離</small></h1>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <!-- Input -->
  <div class="card card-input">
    <div class="input-row">
      <div class="input-group">
        <label>圓直徑 <span class="hint">(D)</span></label>
        <input type="number" id="inpD" value="3" step="0.01" min="0.05" max="20" oninput="syncSlider()">
        <div class="slider-row">
          <input type="range" id="sliderD" min="0.05" max="20" step="0.01" value="3" oninput="syncInput()">
          <span class="slider-val" id="svD">3.00</span>
        </div>
      </div>
      <div class="input-group">
        <label>夾角 <span class="hint">(θ)</span></label>
        <input type="number" id="inpA" value="90" step="1" min="1" max="179" oninput="syncSliderA()">
        <div class="slider-row">
          <input type="range" id="sliderA" min="1" max="179" step="1" value="90" oninput="syncInputA()">
          <span class="slider-val" id="svA">90°</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview -->
  <div class="card card-preview">
    <div class="sv-wrap" id="svWrap">
      <svg id="previewSvg" viewBox="0 0 400 320" width="400" height="320"></svg>
    </div>
    <div class="sv-foot">
      <span>🔵 圓半徑 r = <span id="svRadius">1.50</span> mm</span>
      <span>📐 半角 θ/2 = <span id="svHalfAngle">45.0</span>°</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result-area">
    <div class="rlabel">📏 頂點 → 圓心距離</div>
    <div class="rval"><span id="resInt">2.12</span></div>
    <div class="runit">mm</div>
    <div class="rdetail" id="resDetail">D = 3.00 mm &nbsp;·&nbsp; θ = 90° &nbsp;·&nbsp; r/sin(θ/2)</div>
  </div>

  <!-- Formula -->
  <div class="card card-formula">
    <div class="formula-box">
      <strong>公式：</strong> 距離 = r ÷ sin(θ/2) &nbsp;=&nbsp; <span id="formulaDetail">1.50 ÷ sin(45.0°) = 2.12 mm</span>
    </div>
  </div>
</div>

<script>
let theme = localStorage.getItem('geomTheme') || 'light';
document.body.className = theme;
document.getElementById('themeBtn').textContent = theme==='dark'?'☀️':'🌙';
function toggleTheme(){
  theme = theme==='light'?'dark':'light';
  document.body.className = theme;
  document.getElementById('themeBtn').textContent = theme==='dark'?'☀️':'🌙';
  localStorage.setItem('geomTheme',theme);
  renderPreview();
}

function syncInput(){
  const d = parseFloat(document.getElementById('sliderD').value);
  document.getElementById('inpD').value = d.toFixed(2);
  document.getElementById('svD').textContent = d.toFixed(2);
  calc();
}
function syncSlider(){
  let d = parseFloat(document.getElementById('inpD').value);
  if(isNaN(d)||d<0.05)d=0.05;if(d>20)d=20;
  document.getElementById('sliderD').value = d;
  document.getElementById('svD').textContent = d.toFixed(2);
  calc();
}
function syncInputA(){
  const a = parseFloat(document.getElementById('sliderA').value);
  document.getElementById('inpA').value = a;
  document.getElementById('svA').textContent = a+'°';
  calc();
}
function syncSliderA(){
  let a = parseFloat(document.getElementById('inpA').value);
  if(isNaN(a)||a<1)a=1;if(a>179)a=179;
  document.getElementById('sliderA').value = a;
  document.getElementById('svA').textContent = a+'°';
  calc();
}

function calc(){
  const D = parseFloat(document.getElementById('inpD').value) || 0.05;
  const deg = parseFloat(document.getElementById('inpA').value) || 90;
  const rad = D/2;
  const halfDeg = deg/2;
  const halfRad = halfDeg*Math.PI/180;
  const dist = rad / Math.sin(halfRad);

  document.getElementById('svRadius').textContent = rad.toFixed(2);
  document.getElementById('svHalfAngle').textContent = halfDeg.toFixed(1);

  const intPart = Math.floor(dist);
  const decPart = dist - intPart;
  document.getElementById('resInt').textContent = dist.toFixed(2);
  document.getElementById('resDetail').textContent = `D = ${D.toFixed(2)} mm  ·  θ = ${deg}°  ·  r/sin(θ/2)`;
  document.getElementById('formulaDetail').textContent =
    `${rad.toFixed(2)} ÷ sin(${halfDeg.toFixed(1)}°) = ${dist.toFixed(2)} mm`;

  renderPreview();
}

function renderPreview(){
  const D = parseFloat(document.getElementById('inpD').value) || 3;
  const deg = parseFloat(document.getElementById('inpA').value) || 90;
  const r = D/2;
  const halfDeg = deg/2;
  const dist = r / Math.sin(halfDeg*Math.PI/180);

  const isDark = theme==='dark';
  const clr = isDark?'#aaa':'#444';
  const dimClr = isDark?'#0a84ff':'#0071e3';
  const circleClr = isDark?'#ff9f0a':'#ff6b35';
  const lineClr = isDark?'#5e9eff':'#2563eb';
  const bgClr = isDark?'#2a2a2e':'#f8f9fa';

  // Layout: vertex near top, circle fills available space
  const cx = 200, cy = 55;    // vertex
  const availH = 230;          // available vertical space
  const totalNeeded = dist + r + 12;
  let scale = availH / totalNeeded;
  if (scale > 7) scale = 7;   // cap to prevent excessive zoom
  if (scale < 0.5) scale = 0.5;
  const pixelDist = dist * scale;
  const pixelR = r * scale;

  // Circle center on angle bisector (vertical down)
  const cX = cx, cY = cy + pixelDist;

  // Tangent points
  const halfRad = halfDeg * Math.PI / 180;
  // Points tangent to the two lines - perpendicular to each line from center
  // Line direction angles: -halfDeg and +halfDeg from vertical
  const ang1 = -halfRad;  // left line angle from vertical
  const ang2 = halfRad;   // right line angle from vertical

  // Tangent point = center + radius * perpendicular direction to line
  // Perpendicular to left line (rotate 90° counterclockwise from line direction)
  // Left line direction: (sin(ang1), cos(ang1)) - going down from vertex
  // Perpendicular left: (-cos(ang1), sin(ang1))
  const perp1x = -Math.cos(ang1), perp1y = Math.sin(ang1);
  // Tangent point 1
  const t1x = cX + pixelR * perp1x, t1y = cY + pixelR * perp1y;
  // Tangent point 2
  const perp2x = -Math.cos(ang2), perp2y = Math.sin(ang2);
  const t2x = cX + pixelR * perp2x, t2y = cY + pixelR * perp2y;

  // End points of lines (extend beyond tangent points)
  const ext = 200;
  const l1ex = cx + ext * Math.sin(ang1), l1ey = cy + ext * Math.cos(ang1);
  const l2ex = cx + ext * Math.sin(ang2), l2ey = cy + ext * Math.cos(ang2);

  let svg = `<svg viewBox="0 0 400 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="320" fill="${bgClr}" rx="4"/>
    <defs>
      <marker id="arr1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="${dimClr}"/>
      </marker>
      <marker id="arr2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="${dimClr}"/>
      </marker>
    </defs>
    <!-- Lines -->
    <line x1="${cx}" y1="${cy}" x2="${l1ex}" y2="${l1ey}" stroke="${lineClr}" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${l2ex}" y2="${l2ey}" stroke="${lineClr}" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Circle -->
    <circle cx="${cX}" cy="${cY}" r="${pixelR}" fill="none" stroke="${circleClr}" stroke-width="2.5"/>
    <circle cx="${cX}" cy="${cY}" r="${pixelR}" fill="${circleClr}" opacity=".12"/>
    <!-- Center dot -->
    <circle cx="${cX}" cy="${cY}" r="3.5" fill="${circleClr}" stroke="#fff" stroke-width="1.5"/>
    <!-- Vertex dot -->
    <circle cx="${cx}" cy="${cy}" r="4" fill="${lineClr}" stroke="#fff" stroke-width="1.5"/>
    <!-- Tangent points -->
    <circle cx="${t1x}" cy="${t1y}" r="2.5" fill="#fff" stroke="${clr}" stroke-width="1"/>
    <circle cx="${t2x}" cy="${t2y}" r="2.5" fill="#fff" stroke="${clr}" stroke-width="1"/>
    <!-- Tangent line markers -->
    <line x1="${t1x-8}" y1="${t1y}" x2="${t1x+8}" y2="${t1y}" stroke="${clr}" stroke-width=".8" stroke-dasharray="2,2"/>
    <line x1="${t2x-8}" y1="${t2y}" x2="${t2x+8}" y2="${t2y}" stroke="${clr}" stroke-width=".8" stroke-dasharray="2,2"/>`;

  // Angle arc
  const arcR = 42;
  svg += `<path d="M ${cx + arcR*Math.sin(ang1)} ${cy + arcR*Math.cos(ang1)} A ${arcR} ${arcR} 0 0 1 ${cx + arcR*Math.sin(ang2)} ${cy + arcR*Math.cos(ang2)}" fill="none" stroke="${dimClr}" stroke-width="1.5"/>`;
  const labelRx = cx + (arcR+18) * Math.sin(halfRad) + 30, labelRy = cy + (arcR+18) * Math.cos(halfRad);
  svg += `<text x="${labelRx}" y="${labelRy}" fill="${dimClr}" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle">${deg}°</text>`;

  // Dimension: vertex to center
  const dimOff = -60;
  svg += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cY+5}" stroke="${dimClr}" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>`;
  svg += `<line x1="${dimOff}" y1="${cy}" x2="${dimOff-10}" y2="${cy}" stroke="${dimClr}" stroke-width="1" marker-end="url(#arr1)"/>`;
  svg += `<line x1="${dimOff}" y1="${cY}" x2="${dimOff-10}" y2="${cY}" stroke="${dimClr}" stroke-width="1" marker-end="url(#arr2)"/>`;
  svg += `<line x1="${dimOff}" y1="${cy}" x2="${dimOff}" y2="${cY}" stroke="${dimClr}" stroke-width="1" stroke-dasharray="3,2"/>`;
  const dimMid = (cy + cY)/2;
  svg += `<text x="${dimOff-14}" y="${dimMid}" fill="${dimClr}" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle" transform="rotate(-90,${dimOff-14},${dimMid})">${dist.toFixed(2)}</text>`;

  // Diameter dimension on circle
  const diaOffX = cX + pixelR + 18;
  svg += `<text x="${cX}" y="${cY - pixelR - 14}" fill="${circleClr}" font-size="12" font-weight="600" text-anchor="middle">Ø${D.toFixed(2)}</text>`;
  svg += `<line x1="${cX}" y1="${cY - pixelR}" x2="${cX}" y2="${cY + pixelR}" stroke="${circleClr}" stroke-width="1.2" stroke-dasharray="3,3" opacity=".5"/>`;

  // Labels — pushed apart to avoid crowding
  svg += `<text x="${cx}" y="${cy-44}" fill="${lineClr}" font-size="12" font-weight="600" text-anchor="middle">頂點</text>`;
  svg += `<text x="${cX}" y="${cY+46}" fill="${circleClr}" font-size="12" font-weight="600" text-anchor="middle">圓心</text>`;

  // Legend
  svg += `<rect x="270" y="${320-56}" width="120" height="48" rx="8" fill="${isDark?'rgba(0,0,0,.3)':'rgba(255,255,255,.85)'}" stroke="${isDark?'#444':'#ddd'}" stroke-width=".8"/>`;
  svg += `<circle cx="284" cy="${320-37}" r="4" fill="${circleClr}"/><text x="292" y="${320-34}" fill="${clr}" font-size="11">圓 D = ${D.toFixed(2)} mm</text>`;
  svg += `<text x="282" y="${320-16}" fill="${dimClr}" font-size="10" font-weight="600">距離 = ${dist.toFixed(2)} mm</text>`;

  svg += '</svg>';
  document.getElementById('previewSvg').innerHTML = svg;
}

// Init
calc();
</script>
</body>
</html>
