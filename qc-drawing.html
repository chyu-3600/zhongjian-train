<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶圖紙</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--border:#e3ddd4;--fg:#2a221c;--fg2:#5a4e42;--muted:#a09888;--accent:#0e8a9c;--accent-dim:rgba(14,138,156,.08)}
[data-theme="dark"]{--bg:#0f1218;--card:#1a2030;--border:#2a3a50;--fg:#e8eaed;--fg2:#b0c0d8;--muted:#6b7280;--accent:#3fd0e0;--accent-dim:rgba(63,208,224,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:20px}
.c{max-width:720px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ic{width:46px;height:46px;border-radius:12px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:24px}
.ht{font-size:20px;font-weight:800}
.hs{font-size:12px;color:var(--muted);margin-top:2px}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 20px;text-align:center}
.tag{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;margin-bottom:14px}
.big{font-size:44px;margin-bottom:10px}
.msg{font-size:15px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:var(--fg2);line-height:1.7}
.ft{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="c">
  <div class="hd">
    <div class="ic">📐</div>
    <div><div class="ht">客戶圖紙</div><div class="hs">品質管理 · 客戶圖紙管理</div></div>
  </div>
  <div class="box">
    <div class="big">🗂️</div>
    <div class="tag">入口占位</div>
    <div class="msg">此功能尚未建立內容</div>
    <div class="sub">這裡日後會放客戶圖紙的管理與查詢。<br>請由上方返回「品質管理」選單切換其他功能。</div>
  </div>
  <div class="ft">忠鍵工業 · 品質管理</div>
</div>
</body>
</html>
